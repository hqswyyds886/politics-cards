<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>政治卡片</title>
<style>
:root{
  --bg:#f2f4f8; --card:#fff; --ink:#12192a; --ink2:#5d6a7d; --ink3:#98a3b3;
  --brand:#1a56db; --brand2:#2f8ff0; --ok:#0a9d5c; --bad:#e0342c;
  --line:#e8ecf3; --shadow:0 8px 28px rgba(18,32,60,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);overflow:hidden;
}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
header{padding:calc(env(safe-area-inset-top) + 8px) 16px 4px;display:flex;align-items:center;gap:10px;flex:none}
.brand{font-weight:800;font-size:15px;letter-spacing:.3px}
.spacer{flex:1}
.iconbtn{width:32px;height:32px;border:0;border-radius:50%;background:#fff;box-shadow:var(--shadow);
  font-size:15px;cursor:pointer;display:grid;place-items:center;padding:0;transition:.15s}
.iconbtn:active{transform:scale(.92)}
.iconbtn.off{opacity:.4;filter:grayscale(1)}
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;
  padding:6px 16px 16px;flex-direction:column}
.view.on{display:flex}

/* ============ 首页：词书卡 ============ */
.bookbar{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);flex:none}
.bk-top{display:flex;gap:13px;align-items:center}
.cover{width:52px;height:66px;border-radius:8px;flex:none;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#f59e0b,#d97706);box-shadow:0 4px 12px rgba(217,119,6,.3)}
.cover::after{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.35)}
.cover span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;
  font-size:15px;letter-spacing:1px;writing-mode:vertical-rl;text-orientation:upright}
.bk-info{flex:1;min-width:0}
.bk-name{font-size:16px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.bk-name i{font-style:normal;font-size:11px;color:var(--ink3);font-weight:600}
.bar{height:7px;border-radius:99px;background:#e9eef6;overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));
  transition:width .4s ease}
.bk-nums{display:flex;justify-content:space-between;margin-top:7px;font-size:11.5px;color:var(--ink3);
  font-variant-numeric:tabular-nums}
.bk-nums b{color:var(--ink2);font-weight:700}

/* 今日计划 */
.plan{background:#fff;border-radius:18px;padding:18px 16px 16px;box-shadow:var(--shadow);margin-top:12px;flex:none}
.plan h3{margin:0 0 18px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.plan h3 em{font-style:normal;font-size:11px;color:var(--brand);font-weight:700;margin-left:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.two>div{text-align:left}
.two span{font-size:12.5px;color:var(--ink3);display:block;margin-bottom:8px}
.two b{font-size:34px;font-weight:850;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1}
.two b i{font-style:normal;font-size:15px;color:var(--ink3);font-weight:600;letter-spacing:0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.btns button{border:0;border-radius:12px;padding:15px 0;font-size:17px;font-weight:800;font-family:inherit;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;cursor:pointer;
  box-shadow:0 8px 20px rgba(26,86,219,.26);transition:.13s;letter-spacing:2px}
.btns button:active{transform:scale(.975)}
.btns button.ghost{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 1.5px #cfdcf5}
.btns button:disabled{opacity:.45;box-shadow:none}

/* 已学列表 */
.sec{display:flex;align-items:center;gap:8px;margin:20px 2px 10px;flex:none}
.sec h3{margin:0;font-size:15px;font-weight:800}
.sec em{font-style:normal;font-size:11.5px;color:var(--ink3);font-weight:600}
.searchbox{margin-bottom:10px;flex:none}
.searchbox input{width:100%;border:0;background:#fff;border-radius:12px;padding:12px 14px;font-size:13.5px;
  outline:none;font-family:inherit;box-shadow:var(--shadow)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;background:#e9eef6;border-radius:11px;padding:3px;
  margin-bottom:10px;flex:none}
.seg button{border:0;background:none;border-radius:9px;padding:8px 0;font-size:12.5px;font-weight:800;
  font-family:inherit;color:var(--ink2);cursor:pointer;transition:.16s}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(18,32,60,.1)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;flex:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:#fff;color:var(--ink2);border-radius:99px;padding:7px 14px;font-size:12px;
  font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;box-shadow:0 1px 6px rgba(18,32,60,.06)}
.chip.on{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(26,86,219,.3)}
.plist{display:flex;flex-direction:column;gap:8px;padding-bottom:18px}
.pitem{background:#fff;border-radius:14px;padding:13px 15px;box-shadow:0 2px 10px rgba(18,32,60,.05);cursor:pointer}
.pitem:active{background:#f8fafe}
.pitem .t{font-size:14px;font-weight:700;line-height:1.5;margin-bottom:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pitem .m{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink3)}
.badge{border-radius:5px;padding:2px 6px;font-weight:700;font-size:10px;background:#eef3fb;color:#1a56db}
.badge.due{background:#fee2e2;color:#b91c1c}
.badge.ok2{background:#dcfce7;color:#15803d}
.badge.newb{background:#eef2f8;color:#7c8798}

/* ============ 背诵界面 ============ */
.learnbar{display:flex;align-items:center;gap:12px;padding:4px 0 10px;flex:none}
.learnbar .back{border:0;background:none;font-size:20px;cursor:pointer;padding:2px 6px;color:var(--ink)}
.learnbar .cnt{font-size:13.5px;color:var(--ink2);font-weight:700}
.learnbar .cnt b{color:var(--ink);font-size:15px}
.learnbar .tool{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer;padding:2px 4px}

.visual{height:132px;border-radius:16px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(145deg,#1e3a8a,#2563eb 55%,#0e7490);box-shadow:0 8px 24px rgba(30,58,138,.22)}
.visual .subj{font-size:30px;font-weight:850;color:#fff;letter-spacing:4px;opacity:.96}
.visual .chap{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:10.5px;
  color:rgba(255,255,255,.72);letter-spacing:.6px}
.visual::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}

.word{font-size:21px;font-weight:800;line-height:1.55;text-align:center;margin:20px 2px 6px;letter-spacing:.2px}
.word.new{font-size:19px}
.subline{text-align:center;font-size:11.5px;color:var(--ink3);margin-bottom:18px}

.grid4{display:flex;flex-direction:column;gap:9px;flex:none}
.g4{border:0;background:#fff;border-radius:13px;padding:13px 15px;display:flex;align-items:flex-start;
  justify-content:flex-start;text-align:left;font-size:14px;line-height:1.68;font-family:inherit;font-weight:600;
  color:var(--ink);cursor:pointer;box-shadow:0 2px 10px rgba(18,32,60,.06);transition:.14s;word-break:break-word}
.g4 .ltr{flex:none;width:22px;height:22px;border-radius:50%;background:#eef3fa;color:var(--ink2);
  display:grid;place-items:center;font-size:11px;font-weight:800;margin-right:10px;margin-top:1px}
.g4 .txt{flex:1}
.g4:active{transform:scale(.99)}
.g4.sel{box-shadow:inset 0 0 0 2px var(--brand);background:#f3f7ff}
.g4.sel .ltr{background:var(--brand);color:#fff}
.g4.right{background:#e9fbf3;color:#067a4b;box-shadow:inset 0 0 0 1.5px #34d399}
.g4.right .ltr{background:var(--ok);color:#fff}
.g4.wrong{background:#fdeceb;color:#b91c1c;box-shadow:inset 0 0 0 1.5px #fb7185}
.g4.wrong .ltr{background:var(--bad);color:#fff}
.g4.fade{opacity:.26;pointer-events:none}
.fillstem{background:#fff;border-radius:14px;padding:16px 17px;font-size:15px;line-height:2.05;white-space:pre-wrap;
  box-shadow:var(--shadow);margin-bottom:12px;flex:none}
.fillstem .blank{display:inline-block;min-width:52px;text-align:center;color:var(--brand);font-weight:800;
  border-bottom:2px solid var(--brand);margin:0 2px;letter-spacing:-1px}
.fillstem .qpoint{font-size:11.5px;font-weight:800;color:var(--brand);background:#eef3fb;
  border-radius:8px;padding:6px 10px;margin-bottom:10px;display:inline-block;letter-spacing:.2px}

.toolbar3{display:flex;justify-content:center;gap:44px;padding:16px 0 8px;flex:none}
.tb{width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 12px rgba(18,32,60,.09);
  font-size:19px;cursor:pointer;display:grid;place-items:center;transition:.14s}
.tb:active{transform:scale(.92)}
.tb.on{background:var(--brand);color:#fff}

.detail{margin-top:12px;background:#fff;border-radius:14px;padding:16px;font-size:14.5px;line-height:1.85;
  white-space:pre-wrap;box-shadow:var(--shadow);flex:none}
.detail .lbl{display:block;font-size:11px;font-weight:800;color:var(--ok);letter-spacing:1px;margin-bottom:8px}
.detail .dtxt{white-space:pre-wrap;line-height:1.9}

/* 结束页 */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;
  color:var(--ink2);text-align:center;padding:26px}
.empty .big{font-size:54px;line-height:1}
.empty h3{margin:0;font-size:18px;color:var(--ink)}
.empty p{margin:0;font-size:13px;line-height:1.7;color:var(--ink3);max-width:280px}
.btn{border:0;border-radius:12px;padding:14px 24px;font-size:15px;font-weight:800;cursor:pointer;
  background:var(--brand);color:#fff;font-family:inherit;box-shadow:0 8px 20px rgba(26,86,219,.24)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow)}

/* 真题 */
.qbar{display:flex;align-items:center;gap:9px;padding:2px 0 10px;flex:none}
.qbar .back{border:0;background:#fff;border-radius:10px;width:34px;height:34px;font-size:19px;
  cursor:pointer;box-shadow:var(--shadow);display:grid;place-items:center;padding:0;line-height:1}
.qbar .qtitle{font-size:14px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbar .qtitle .qprog{display:block;font-size:10.5px;color:var(--ink3);font-weight:600;margin-top:2px}
.qbar2{padding:0 0 12px;flex:none}
.pbar{height:5px;border-radius:99px;background:#e3eaf4;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .3s}
.qbar .qprog{font-size:12.5px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.qbar .reset{border:0;background:#fff;border-radius:10px;width:34px;height:34px;font-size:16px;
  cursor:pointer;box-shadow:var(--shadow);display:grid;place-items:center;padding:0;color:var(--ink2)}
.resume{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:14px 15px;
  box-shadow:var(--shadow);margin-bottom:12px}
.resume .rinfo{flex:1;min-width:0}
.resume .rt{font-size:13.5px;font-weight:800;margin-bottom:3px}
.resume .rd{font-size:11.5px;color:var(--ink3)}
.btn.sm{padding:9px 15px;font-size:13px;border-radius:10px;box-shadow:none}
.btn.sm.ghost{background:#f2f5fa;color:var(--ink2)}
.ansline{font-size:13.5px;color:var(--ink2);margin-bottom:10px}
.ansline b{color:var(--ok);font-size:15px}
.ansline b.u{color:var(--bad)}
.rel{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.relh{font-size:11.5px;font-weight:800;color:var(--brand);margin-bottom:9px;letter-spacing:.5px}
.relitem{background:#f7f9fd;border-radius:11px;padding:11px 13px;margin-bottom:8px}
.relf{font-size:13.5px;font-weight:800;margin-bottom:5px;line-height:1.5}
.relb{font-size:12.5px;line-height:1.75;color:var(--ink2);white-space:pre-wrap}
.relnone{font-size:12.5px;color:var(--ink3);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.quizhead{display:flex;align-items:center;gap:9px;padding:0 0 10px;font-size:12px;flex-wrap:wrap}
.pill{background:#e8f0ff;color:var(--brand);border-radius:99px;padding:5px 11px;font-weight:800;font-size:11.5px}
.pill.multi{background:#ede9fe;color:#7c3aed}
.qstem{font-size:16.5px;line-height:1.8;font-weight:600;margin-bottom:16px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;background:#fff;border-radius:14px;padding:13px 14px;
  font-size:14px;line-height:1.6;cursor:pointer;box-shadow:0 2px 10px rgba(18,32,60,.05);transition:.14s}
.opt .ltr{flex:none;width:23px;height:23px;border-radius:50%;background:#eef3fa;color:var(--ink2);
  display:grid;place-items:center;font-size:11.5px;font-weight:800}
.opt.right{background:#e9fbf3;box-shadow:inset 0 0 0 1.5px #34d399}
.opt.right .ltr{background:var(--ok);color:#fff}
.opt.wrong{background:#fdeceb;box-shadow:inset 0 0 0 1.5px #fb7185}
.opt.wrong .ltr{background:var(--bad);color:#fff}
.ana{margin-top:10px;padding:14px 16px;border-radius:14px;background:#fff;font-size:14px;line-height:1.85;
  color:var(--ink2);white-space:pre-wrap;box-shadow:var(--shadow)}
.verdict{font-weight:850;font-size:14.5px;margin-bottom:8px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}

/* 题库列表（EXAM-MASTER 式） */
.qcount{font-size:11.5px;color:var(--ink3);margin:2px 2px 10px}
.qbank{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.qitem{background:#fff;border-radius:13px;padding:13px 15px;box-shadow:0 2px 10px rgba(18,32,60,.05);cursor:pointer}
.qitem:active{background:#f8fafe}
.qmeta{font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.qmeta b{color:var(--brand);font-weight:800}
.tagx{background:#eef3fb;color:#1d4ed8;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:700}
.tagx.m{background:#ede9fe;color:#7c3aed}
.qtext{font-size:13.5px;line-height:1.6;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 0}
.pgb{border:0;background:#fff;border-radius:10px;padding:9px 16px;font-size:12.5px;font-weight:700;
  font-family:inherit;color:var(--ink2);box-shadow:var(--shadow);cursor:pointer}
.pgb:disabled{opacity:.4}
.pgn{font-size:12px;color:var(--ink3);font-weight:700}
.qactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 0 20px}
.qactions .btn{padding:14px 0;font-size:13.5px}

.goalopts{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.goalopts .exb{padding:11px 20px;font-size:14px}
.goalin{display:flex;align-items:center;gap:10px;margin:14px 0 12px}
.goalin #goalInput{flex:1;text-align:center;font-size:26px;font-weight:850;font-family:inherit;
  border:1.5px solid var(--line);border-radius:13px;padding:10px 8px;color:var(--brand);
  background:#fff;font-variant-numeric:tabular-nums;outline:none}
.goalin #goalInput:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.goalin .gstep{flex:none;width:48px;height:48px;border:1.5px solid var(--line);background:#fff;
  border-radius:13px;font-size:19px;font-weight:800;font-family:inherit;color:var(--ink2);cursor:pointer}
.goalin .gstep:active{background:#f3f7ff}
/* 去掉 number 的上下箭头 */
.goalin input::-webkit-outer-spin-button,
.goalin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.goalin input[type=number]{-moz-appearance:textfield}

/* 今日进度（右上角） */
.learnbar{display:flex;align-items:center;gap:10px}
.learnbar .cnt{flex:1}
.todayprog{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.tpnum{font-size:12px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1}
.tpnum i{font-style:normal;color:var(--ink3);font-weight:600;font-size:10.5px}
.tpbar{width:56px;height:4px;background:#e6ecf5;border-radius:2px;overflow:hidden}
.tpbar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e);
  border-radius:2px;transition:width .3s}

/* 答题反馈 */
.qfb{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);padding-bottom:18px}
.fbt{font-size:15px;font-weight:800;margin-bottom:9px}
.fbt.ok{color:#059669}
.fbt.bad{color:#dc2626}
.fba{font-size:12.5px;color:var(--ink2);margin-bottom:9px}
.fba b{color:var(--brand);font-size:14px}
.fbc{font-size:13px;line-height:1.85;color:var(--ink);background:#f7fafc;border-radius:11px;padding:12px 13px}
.fbn{font-size:11.5px;color:#b45309;margin-top:9px}
.fbn.ok{color:#059669}

/* 语速滑块 */
.rateslider{width:100%;-webkit-appearance:none;height:6px;border-radius:99px;
  background:linear-gradient(90deg,#bfdbfe,#3b82f6,#f59e0b);outline:none;margin:14px 0 6px}
.rateslider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:#fff;border:3px solid var(--brand);box-shadow:0 2px 8px rgba(59,130,246,.35);cursor:pointer}
.rateslider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;
  border:3px solid var(--brand);cursor:pointer}
.ratehint{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);padding:0 2px}

/* 音色选择 */
.vlist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.vitem{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;
  border-radius:13px;padding:12px 44px 12px 14px;font-family:inherit;cursor:pointer;position:relative}
.vitem.on{border-color:var(--brand);background:#f6f9ff}
.vitem .vn{font-size:14.5px;font-weight:800;color:var(--ink)}
.vitem .vn i{font-style:normal;font-size:11px;color:var(--ink3);font-weight:600;margin-left:7px}
.vitem .vd{font-size:11.5px;color:var(--ink3);margin-top:3px}
.vitem .vplay{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;background:#eef3fb;color:#1d4ed8;
  display:grid;place-items:center;font-size:11px}

/* AI 结果对比 */
.fixbox{margin-top:6px;max-height:52vh;overflow:auto}
.fixold,.fixnew{background:#f7fafc;border-radius:12px;padding:12px 13px;font-size:12.5px;
  line-height:1.75;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.fixnew{background:#f0fdf6}
.fixold .fl,.fixnew .fl{display:block;font-size:10.5px;font-weight:800;letter-spacing:.5px;
  margin-bottom:6px;color:var(--ink3);text-transform:uppercase}
.fixnew .fl.ok{color:#15803d}
.fixarrow{text-align:center;font-size:11px;color:var(--ink3);padding:7px 0}

/* 饮食看板 */
.nd-cal{background:linear-gradient(135deg,#eff6ff,#f0fdf4);border-radius:16px;padding:14px;margin-bottom:12px}
.nd-main{text-align:center;margin-bottom:10px}
.nd-main b{font-size:30px;font-weight:900;color:#1d4ed8;line-height:1}
.nd-main span{display:block;font-size:11px;color:var(--ink3);margin-top:4px}
.nd-src{display:inline-block;font-size:9.5px;padding:2px 6px;border-radius:99px;
  background:#e2e8f0;color:#475569;margin-left:4px;font-weight:800}
.nd-src.ok{background:#dcfce7;color:#15803d}
.nd-sub{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nd-sub div{text-align:center;background:rgba(255,255,255,.75);border-radius:9px;padding:6px 3px}
.nd-sub i{display:block;font-style:normal;font-size:9.5px;color:var(--ink3)}
.nd-sub em{display:block;font-style:normal;font-size:12.5px;font-weight:800;color:var(--ink);margin-top:2px}
.nd-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.nd-m{border-radius:12px;padding:10px 6px;text-align:center;background:#fff;box-shadow:var(--shadow)}
.nd-m b{display:block;font-size:17px;font-weight:900;line-height:1.1}
.nd-m span{display:block;font-size:10px;color:var(--ink3);margin-top:2px}
.nd-m i{display:block;font-style:normal;font-size:9.5px;color:var(--ink3);margin-top:2px}
.nd-m.p b{color:#dc2626} .nd-m.c b{color:#2563eb} .nd-m.f b{color:#b45309}
.nd-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  padding:8px 2px;border-bottom:1px solid #f1f5f9;font-size:12px}
.nd-row span{color:var(--ink3);flex:none}
.nd-row em{font-style:normal;color:var(--ink);font-weight:700;text-align:right}
.nd-guard{border-radius:12px;padding:11px 13px;margin:12px 0;background:#f8fafc;
  border-left:4px solid #cbd5e1}
.nd-guard.ok{background:#f0fdf4;border-left-color:#22c55e}
.nd-guard.warn{background:#fffbeb;border-left-color:#f59e0b}
.nd-gh{font-size:13px;font-weight:850;color:var(--ink);margin-bottom:4px}
.nd-gb{font-size:11.5px;color:var(--ink2);line-height:1.6}
.nd-gn{font-size:10.5px;color:var(--ink3);margin-top:4px}
.nd-adapt{background:#f5f3ff;border-radius:12px;padding:11px 13px;margin-bottom:12px}
.nd-adapt.dim{background:#f8fafc}
.nd-adapt b{display:block;font-size:11.5px;color:#6d28d9;margin-bottom:4px}
.nd-adapt.dim b{color:var(--ink3)}
.nd-adapt div{font-size:11.5px;color:var(--ink2);line-height:1.6}
.nd-conf{font-size:10.5px;color:var(--ink3);margin-top:4px}
.nd-actions{display:flex;gap:8px;margin-top:12px}
.nd-actions .btn{padding:12px 0;font-size:12.5px}

/* 训练状态 */
.fp-status{margin-bottom:12px}
.fs-title{font-size:12px;color:var(--ink3);font-weight:800;letter-spacing:.5px;margin-bottom:7px}
.fs-empty{font-size:11.5px;color:var(--ink3);background:#f8fafc;border-radius:10px;
  padding:11px;line-height:1.6}
.fs-row{border-radius:11px;padding:10px 12px;margin-bottom:7px;border-left:4px solid #cbd5e1;
  background:#f8fafc}
.fs-row.go{border-left-color:#22c55e;background:#f0fdf4}
.fs-row.hold{border-left-color:#f59e0b;background:#fffbeb}
.fs-row.stall{border-left-color:#ef4444;background:#fef2f2}
.fs-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.fs-h b{flex:1;font-size:12.5px;color:var(--ink);font-weight:800}
.fs-tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:#e2e8f0;color:#475569}
.fs-row.go .fs-tag{background:#dcfce7;color:#15803d}
.fs-row.hold .fs-tag{background:#fef3c7;color:#b45309}
.fs-row.stall .fs-tag{background:#fee2e2;color:#b91c1c}
.fs-d{font-size:11px;color:var(--ink2);line-height:1.6}
.fs-n{font-size:11px;color:var(--ink3);margin-top:3px}
.fs-n b{color:#15803d;font-size:12.5px}
.fs-w{font-size:11px;color:#b91c1c;margin-top:3px;font-weight:700}

/* 档案列表 */
.fitlist{display:flex;flex-direction:column;gap:8px}
.fl-empty{font-size:12px;color:var(--ink3);padding:10px 0;text-align:center}
.fl-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;
  padding:11px 13px;cursor:pointer;box-shadow:0 2px 8px rgba(21,128,61,.07)}
.fl-row:active{background:#f0fdf4}
.fl-main{flex:1;min-width:0}
.fl-main b{display:block;font-size:14px;color:var(--ink);font-weight:850}
.fl-main span{font-size:11px;color:var(--ink3)}
.fl-go{flex:none;font-size:11.5px;color:#15803d;font-weight:700}

/* 健身计算结果卡片 */
.fp-calc{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.fp-calc .fc{background:#fff;border-radius:11px;padding:9px 6px;text-align:center;box-shadow:var(--shadow)}
.fp-calc .fc b{display:block;font-size:15px;color:#15803d;font-weight:850;line-height:1.2}
.fp-calc .fc span{font-size:9.5px;color:var(--ink3);line-height:1.3;display:block;margin-top:2px}
.fp-logbtn{width:100%;margin-top:8px;border:1.5px dashed #86efac;background:#f0fdf4;
  color:#15803d;border-radius:10px;padding:9px;font-size:11.5px;font-weight:700;
  font-family:inherit;cursor:pointer}
.fp-logbtn:active{background:#dcfce7}

/* 健身教练 */
.fitbox{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border-radius:18px;padding:16px;
  margin-top:12px;box-shadow:var(--shadow)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.fgrid label,.fwide{display:block;font-size:11.5px;color:var(--ink3);font-weight:700}
.fgrid input,.fgrid select,.fwide input,.fwide select{
  width:100%;box-sizing:border-box;margin-top:5px;border:1.5px solid var(--line);
  border-radius:10px;padding:10px;font-size:15px;font-family:inherit;background:#fff;outline:none}
.fgrid input:focus,.fwide input:focus{border-color:#22c55e}
.fwide{margin-top:10px}
.fp-sum{background:#f0fdf4;border-radius:12px;padding:12px 13px;font-size:13px;line-height:1.75;
  color:#166534;margin-bottom:12px}
.fp-blk{margin-bottom:14px}
.fp-blk>b{display:block;font-size:12px;color:var(--ink3);font-weight:800;margin-bottom:7px;
  letter-spacing:.5px}
.fp-blk>div{font-size:13px;line-height:1.8;color:var(--ink2);white-space:pre-wrap;
  background:#f8fafc;border-radius:11px;padding:11px 12px}
.fp-day{background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:9px;box-shadow:var(--shadow)}
.fp-dh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.fp-dh b{font-size:13.5px;color:var(--brand);font-weight:850}
.fp-dh span{font-size:11.5px;color:var(--ink3)}
.fp-warm{font-size:11px;color:#b45309;margin-bottom:8px}
.fp-tb{width:100%;border-collapse:collapse;font-size:11.5px}
.fp-tb th{text-align:left;color:var(--ink3);font-weight:700;padding:3px 4px;border-bottom:1px solid var(--line)}
.fp-tb td{padding:6px 4px;border-bottom:1px solid #f1f5f9;color:var(--ink2);vertical-align:top}
.fp-tb td:first-child{font-weight:700;color:var(--ink)}
.fp-note{display:block;font-style:normal;font-size:10.5px;color:var(--ink3);margin-top:3px;font-weight:400}

/* 开发者面板 */
.devbox{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border-radius:18px;padding:16px;
  margin-top:12px;box-shadow:var(--shadow)}
.devlog{margin-top:10px}
.devlog .dl{font-size:11.5px;line-height:1.7;padding:6px 9px;border-radius:8px;margin-bottom:5px;
  background:#fff;color:var(--ink2)}
.devlog .dl.ok{background:#f0fdf4;color:#15803d}
.devlog .dl.bad{background:#fef2f2;color:#b91c1c}
.devlog .dl.pending{background:#fffbeb;color:#b45309}
.devlog .dl.hint{background:#f8fafc;color:var(--ink3)}
.devlog a{color:var(--brand);font-weight:700}

/* 大题错题条目 */
.datiwrong{background:#fff;border-radius:11px;padding:10px 12px;margin-top:8px;cursor:pointer}
.datiwrong:active{background:#fef2f2}
.datiwrong .dwr{font-size:10.5px;color:#b91c1c;font-weight:800;margin-bottom:4px}
.datiwrong .dws{font-size:12px;color:var(--ink2);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 大题工具条 */
/* 卡片工具条（学习/小测/真题通用） */
.datitools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px;
  padding-top:10px;border-top:1px dashed var(--line)}
.dtilink{background:#f8fafc;border:1px solid var(--line);border-radius:99px;
  color:var(--ink3);font-size:11.5px;font-family:inherit;
  padding:8px 13px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center}
.dtilink:active{background:#eef3fb;color:var(--brand);border-color:var(--brand)}

/* 大题专区 */
.datibox{background:linear-gradient(135deg,#f5f3ff,#eef2ff);border-radius:18px;padding:16px;
  margin-top:12px;flex:none;box-shadow:var(--shadow)}
.dbhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dbhead .dbic{width:34px;height:34px;border-radius:11px;background:#ede9fe;display:grid;
  place-items:center;font-size:17px;flex:none}
.dbhead b{display:block;font-size:15px;color:var(--ink);font-weight:850;line-height:1.3}
.dbhead i{font-style:normal;font-size:11px;color:#6d28d9}
.dbbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dbb{border:0;background:#fff;border-radius:13px;padding:13px 12px;text-align:left;
  font-family:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(109,40,217,.08)}
.dbb:active{transform:scale(.98)}
.dbb b{display:block;font-size:13.5px;color:#4c1d95;font-weight:800;margin-bottom:3px}
.dbb span{font-size:10.5px;color:#7c3aed}

/* 大题挖空页 */
.datiTag{font-size:11px;color:#6d28d9;background:#f5f3ff;border-radius:8px;
  padding:6px 10px;margin:2px 0 10px;display:inline-block;font-weight:700;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.datiStem{background:#fff;border-radius:14px;padding:14px 15px;font-size:13.5px;line-height:2.05;
  color:var(--ink2);box-shadow:var(--shadow);max-height:38vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.datiStem .blank2{color:#2563eb;font-weight:800;letter-spacing:1px;background:#eff6ff;
  border-radius:4px;padding:0 3px}
.opt.opt-sm{font-size:12.5px;line-height:1.75}

/* 大题背诵页 */
.datihead{display:flex;align-items:flex-start;gap:10px;margin:4px 0 12px}
.datihead .dt{flex:1;font-size:16px;font-weight:850;color:var(--ink);line-height:1.5}
.dtspeak{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:#eef3fb;
  color:#1d4ed8;font-size:16px;cursor:pointer;display:grid;place-items:center}
.dtspeak.on{background:#2563eb;color:#fff}
.datiBody{background:#f8fafc;border-radius:14px;padding:15px 16px;font-size:14px;line-height:2;
  color:var(--ink);white-space:pre-wrap;max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  word-break:break-word}
.datiFoot{display:flex;gap:10px;margin-top:14px}
.datiFoot .btn{padding:14px 0;font-size:14px}

/* 报错入口 */
.issuelink{background:none;border:0;color:var(--ink3);font-size:11px;font-family:inherit;
  padding:10px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.curcard{background:#f7fafc;border-radius:12px;padding:11px 13px;margin:10px 0 12px}
.curcard .cc-f{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:5px}
.curcard .cc-b{font-size:11.5px;color:var(--ink2);line-height:1.6;max-height:80px;overflow:hidden}
.issueinput{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;
  font-family:inherit;font-size:16px;line-height:1.6;resize:vertical;outline:none;box-sizing:border-box}
.issueinput:focus{border-color:var(--brand)}
.issuerow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.issuerow .chip{padding:7px 12px;font-size:11.5px;min-height:36px}

/* 朗读按钮 */
.spkrow{display:flex;align-items:center;justify-content:center;gap:6px;margin:9px 0 0;flex-wrap:wrap}
.spkrow .autospeak{padding:9px 11px;font-size:11px}
.speakbtn{border:0;background:#eef3fb;color:#1d4ed8;border-radius:99px;padding:9px 18px;
  font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;min-height:40px}
.speakbtn.on{background:#2563eb;color:#fff}
.speakbtn.on::after{content:'播放中';font-size:11px}
.autospeak{border:1.5px solid var(--line);background:#fff;color:var(--ink3);border-radius:99px;
  padding:9px 14px;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;min-height:40px}
.autospeak.on{border-color:#22c55e;background:#f0fdf4;color:#15803d}

/* 新卡先学 */
.studyread{background:#fff;border-radius:16px;padding:16px 17px;box-shadow:var(--shadow);
  line-height:1.95;font-size:14px;color:var(--ink);white-space:pre-wrap;overflow-y:auto;
  flex:1;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.studyread .lbl{display:block;font-size:11px;font-weight:800;color:var(--ok);letter-spacing:1px;margin-bottom:9px}
.studyhint{font-size:12px;color:var(--ink3);text-align:center;margin-bottom:10px}

/* 多选题提示 & 排除法 */
.multitip{background:#f5f3ff;border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:12px;
  color:#5b21b6;line-height:1.7;border-left:3px solid #8b5cf6}
.multitip b{font-weight:800}
.exclbox{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}
.exclbox .eh{font-size:11.5px;font-weight:800;color:#1d4ed8;margin-bottom:8px;letter-spacing:.4px}
.exclstep{display:flex;gap:8px;font-size:12px;line-height:1.7;color:var(--ink2);margin-bottom:6px}
.exclstep .en{flex:none;width:18px;height:18px;border-radius:50%;background:#eef3fb;color:#1d4ed8;
  font-size:10px;font-weight:800;display:grid;place-items:center;margin-top:1px}

/* 易错判断 */
.judgebox{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.judgebox .jh{font-size:11.5px;font-weight:800;color:#b45309;margin-bottom:9px;letter-spacing:.4px}
.jitem{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.7;
  background:#fff;border-radius:10px;padding:9px 11px;margin-bottom:7px;color:var(--ink2)}
.jitem .jt{flex:none;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:800;margin-top:1px}
.jitem.ok{background:#f0fdf6}
.jitem.ok .jt{background:#dcfce7;color:#15803d}
.jitem.bad{background:#fff5f5}
.jitem.bad .jt{background:#fee2e2;color:#b91c1c}

/* 模式选择 */
.modebtn{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1.5px solid var(--line);
  background:#fff;border-radius:15px;padding:18px 18px;margin-bottom:11px;font-family:inherit;cursor:pointer;
  text-align:left;transition:.14s}
.modebtn:active{transform:scale(.985);background:#f8faff}
.modebtn b{font-size:16px;color:var(--ink);font-weight:800}
.modebtn span{font-size:12px;color:var(--ink3);line-height:1.5}
#mExam{border-color:#fde68a;background:#fffdf5}
#mExam b{color:#b45309}

/* 模拟考试 */
.exrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.exrow label{font-size:12.5px;color:var(--ink3);width:34px;flex:none}
.exopts{display:flex;gap:7px;flex-wrap:wrap}
.exb{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:12.5px;
  font-weight:700;font-family:inherit;color:var(--ink2);cursor:pointer}
.exb.on{border-color:var(--brand);background:#f3f7ff;color:var(--brand)}
.exclock{font-size:14px;font-weight:800;color:var(--bad);font-variant-numeric:tabular-nums;
  background:#fef2f2;border-radius:9px;padding:6px 10px}
.exnav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}
.exnav .btn{padding:12px 0;font-size:13.5px}
.scell.done{background:#dbeafe;color:#1d4ed8}
.sheetlegend i.done{background:#dbeafe}
.qlist{margin-top:16px;display:flex;flex-direction:column;gap:7px;padding-bottom:20px}
.qres{display:flex;align-items:center;gap:9px;background:#fff;border-radius:11px;padding:10px 12px;
  font-size:12.5px;box-shadow:0 2px 8px rgba(18,32,60,.05);cursor:pointer}
.qres .qi{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:800;background:#eef2f8;color:var(--ink2)}
.qres.ok .qi{background:#dcfce7;color:#15803d}
.qres.bad .qi{background:#fee2e2;color:#b91c1c}
.qres .qt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.qres .qm{flex:none;font-weight:800;color:var(--ink3);font-size:11.5px}

/* 答题卡 */
.sheetgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}
.scell{border:0;background:#eef2f8;color:var(--ink2);border-radius:9px;height:40px;font-size:13px;
  font-weight:800;font-family:inherit;cursor:pointer}
.scell.ok{background:#dcfce7;color:#15803d}
.scell.bad{background:#fee2e2;color:#b91c1c}
.scell.cur{background:var(--brand);color:#fff}
.sheetlegend{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.sheetlegend span{display:flex;align-items:center;gap:5px}
.sheetlegend i{width:10px;height:10px;border-radius:3px;background:#eef2f8;display:inline-block;font-style:normal}
.sheetlegend i.ok{background:#dcfce7}
.sheetlegend i.bad{background:#fee2e2}
.sheetlegend i.cur{background:var(--brand)}
.qbar .sheetbtn,.qbar .favbtn{border:0;background:#fff;border-radius:10px;width:34px;height:34px;
  font-size:15px;cursor:pointer;box-shadow:var(--shadow);display:grid;place-items:center;padding:0;color:var(--ink2)}
.qbar .favbtn{color:#f59e0b}

/* 归因 & 方法卡 */
.reasonbox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.reasonbox .rh{font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:9px}
.reasonbox .rh span{font-weight:500;color:var(--ink3);font-size:11px}
.rbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:1.5px solid var(--line);
  background:#fff;border-radius:11px;padding:10px 13px;margin-bottom:7px;font-family:inherit;cursor:pointer;text-align:left}
.rbtn b{font-size:13px;color:var(--ink)}
.rbtn span{font-size:11px;color:var(--ink3)}
.rbtn.on{border-color:var(--brand);background:#f3f7ff}
.rbtn.on b{color:var(--brand)}
.tipcard{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px;flex:none}
.tiph{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;cursor:pointer}
.tiph span{margin-left:auto;font-size:11px;color:var(--ink3);font-weight:600}
.tipb{font-size:12.5px;line-height:1.95;color:var(--ink2);margin-top:10px;display:none}
.tipb.on{display:block}
.tipb b{color:var(--brand)}

/* 解析高亮 & 固定搭配 */
.hk{color:#1a56db;font-weight:800;background:#eef3fb;padding:0 3px;border-radius:3px}
.hok{color:#059669;font-weight:800}
.hbad{color:#dc2626;font-weight:800}
.fixedbox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.fixedbox .fh{font-size:11.5px;font-weight:800;color:#b45309;margin-bottom:9px;letter-spacing:.4px}
.fitem{background:#fffbeb;border-radius:11px;padding:11px 13px;margin-bottom:8px;border-left:3px solid #f59e0b}
.fitem .fk{font-size:11px;color:#a16207;font-weight:800;margin-bottom:4px}
.fitem .fa{font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.6}
.fitem .fn{font-size:11.5px;color:#92400e;margin-top:4px;line-height:1.6}

/* 解析结构化 */
.amain{font-size:13.5px;line-height:1.85;color:var(--ink2);margin-bottom:12px;white-space:pre-wrap}
.aitems{border-top:1px dashed var(--line);padding-top:11px}
.ah{font-size:11px;font-weight:800;color:var(--ink3);letter-spacing:1px;margin-bottom:8px}
.aitem{display:flex;gap:9px;border-radius:10px;padding:9px 11px;margin-bottom:7px;font-size:13px;line-height:1.7}

  font-size:10.5px;font-weight:800;margin-top:1px}
.aitem.ok{background:#eefaf3;color:#0a7a4e}
.aitem.ok .al{background:var(--ok);color:#fff}

/* 错题本 & 知识点关联题 */
.qlink{background:#fff;border-radius:13px;padding:13px 15px;margin-bottom:9px;box-shadow:0 2px 10px rgba(18,32,60,.05);cursor:pointer}
.qlink:active{background:#f8fafe}
.qsrc{font-size:11.5px;color:var(--ink3);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.qsrc b{color:var(--brand);font-weight:800}
.qsrc span{background:#eef3fb;border-radius:5px;padding:1px 6px;font-size:10px}
.qtxt{font-size:13.5px;line-height:1.6;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.relex{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.relex .relh{font-size:11.5px;font-weight:800;color:var(--brand);margin-bottom:9px}
.relload{font-size:12px;color:var(--ink3)}
.qopts{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.qo{display:flex;gap:9px;background:#f7f9fd;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6}
.qo b{flex:none;width:20px;height:20px;border-radius:50%;background:#e4eaf4;display:grid;place-items:center;font-size:11px}
.qo.ok{background:#e9fbf3}
.qo.ok b{background:var(--ok);color:#fff}
.qana{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.85;color:var(--ink2);white-space:pre-wrap}
.qana .lbl{font-size:11px;font-weight:800;color:var(--brand);letter-spacing:1px;margin-bottom:6px;display:block}

/* 我的 */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:6px 0 16px}
.stat{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:25px;letter-spacing:-.5px}
.stat span{font-size:11.5px;color:var(--ink3)}
.row{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:13px;
  padding:14px 16px;margin-bottom:9px;font-size:13.5px}
.row em{font-style:normal;color:var(--ink2)}

/* 记忆曲线 */
.curve{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.curve h4{margin:0 0 4px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.curve .note{font-size:11px;color:var(--ink3);margin-bottom:10px;line-height:1.5}
.curve svg{display:block;width:100%;height:auto}
.bars{display:flex;align-items:flex-end;gap:7px;height:74px;margin-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;border-radius:5px 5px 3px 3px;
  background:linear-gradient(180deg,#5b9bf5,#1a56db);min-height:3px;transition:height .4s}
.bars .b.today i{background:linear-gradient(180deg,#fbbf24,#d97706)}
.bars .b span{font-size:9.5px;color:var(--ink3);white-space:nowrap}
.bars .b b{font-size:10px;color:var(--ink2);font-weight:700}
.dist{display:flex;height:11px;border-radius:99px;overflow:hidden;margin:10px 0 7px;background:#eef2f8}
.dist i{display:block;height:100%}
.dist-legend{display:flex;flex-wrap:wrap;gap:9px;font-size:10.5px;color:var(--ink2)}
.dist-legend span{display:flex;align-items:center;gap:4px}
.dist-legend em{width:8px;height:8px;border-radius:3px;display:inline-block;font-style:normal}
.kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.kpi div{background:#f7f9fd;border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:19px;letter-spacing:-.3px}
.kpi span{font-size:10px;color:var(--ink3)}

/* 弹窗 / 登录 */
.mask{position:fixed;inset:0;background:rgba(16,26,45,.42);display:none;align-items:flex-end;
  justify-content:center;z-index:200}
.mask.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:86vh;background:#fff;border-radius:22px 22px 0 0;
  padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);overflow-y:auto;
  animation:up .26s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(36px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:#e0e6ef;margin:0 auto 16px}
.sheet h2{margin:0 0 4px;font-size:18px;line-height:1.45}
.sheet .sub{font-size:11.5px;color:var(--ink3);margin-bottom:16px}
.sheet .body{font-size:15px;line-height:1.9;white-space:pre-wrap}
.sheet .meta{display:flex;gap:16px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink3)}
.sheet .meta b{display:block;font-size:15px;color:var(--ink);margin-top:2px}

.login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:13px;padding-bottom:40px}
.login h2{margin:0;font-size:24px}
.login p{margin:0 0 8px;color:var(--ink3);font-size:13px}
input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:14px 15px;
  font-size:15px;outline:none;font-family:inherit;transition:.15s}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.1)}
.err{color:var(--bad);font-size:13px;min-height:17px}
.toggle{text-align:center;font-size:13px;color:var(--ink2);cursor:pointer}
.toggle b{color:var(--brand)}

/* 底栏 */
nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.95);
  backdrop-filter:blur(20px);border-top:1px solid var(--line);
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;color:var(--ink3);cursor:pointer;padding:4px 0;font-family:inherit;font-weight:700}
nav button .ic{font-size:19px;line-height:1;filter:grayscale(1);opacity:.5;transition:.15s}
nav button.on{color:var(--brand)}
nav button.on .ic{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,18px);background:#12192a;color:#fff;
  padding:11px 18px;border-radius:99px;font-size:12.5px;opacity:0;pointer-events:none;transition:.24s;
  z-index:300;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ========== 手机适配 ========== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
@supports (height:100dvh){ html,body{height:100dvh} }
.app > nav{padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.btn,.chip,.opt,.scell,.pgb,.exb,.modebtn,.sheetbtn,.favbtn{
  min-height:44px; touch-action:manipulation;
}
.opt{padding-top:13px;padding-bottom:13px}
input,textarea,select{font-size:16px!important}
@media (max-width:380px){
  .word{font-size:22px!important}
  .qstem,.fillstem{font-size:14px!important}
  .opt{font-size:13px!important;padding:11px 12px!important}
  .visual{height:110px!important}
  .statgrid{grid-template-columns:1fr 1fr!important}
  .sheetgrid{grid-template-columns:repeat(5,1fr)!important}
  .chips{gap:6px}
  .chip{padding:8px 12px;font-size:12px}
}
@media (max-height:640px){
  .visual{height:90px!important}
  .word{margin:8px 0 6px!important;font-size:22px!important}
  .qbar{margin-bottom:8px!important}
}
@media (min-width:560px){
  .view{max-width:560px;margin:0 auto;left:0;right:0}
  .app > nav{max-width:560px;margin:0 auto;width:100%}
}
@media (orientation:landscape) and (max-height:500px){
  .view{max-width:720px;margin:0 auto;left:0;right:0}
}

</head>
<body>
<div id="app">
  <header>
    <div class="brand">政治卡片</div>
    <div class="spacer"></div>
    <button class="iconbtn" id="sfxbtn" title="音效">🔊</button>
  </header>
  <main>
    <div class="view on" id="v-home"></div>
    <div class="view" id="v-study"></div>
    <div class="view" id="v-quiz"></div>
    <div class="view" id="v-wrong"></div>
    <div class="view" id="v-me"></div>
  </main>
  <nav>
    <button data-tab="home" class="on"><span class="ic">📖</span>书桌</button>
    <button data-tab="quiz"><span class="ic">📝</span>真题</button>
    <button data-tab="wrong"><span class="ic">🔁</span>错题</button>
    <button data-tab="me"><span class="ic">👤</span>我的</button>
  </nav>
</div>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const API = '';
const SFX = {
  ctx:null, on: localStorage.getItem('kw_sfx') !== '0',
  ac(){ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; this.ctx=new C(); }
        if(this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); return this.ctx; },
  note(f,st,dur,o){ if(!this.on) return; const ac=this.ac(); if(!ac) return; o=o||{};
    const t0=ac.currentTime+st, osc=ac.createOscillator(), g=ac.createGain();
    osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t0);
    if(o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide,t0+dur);
    const v=o.vol||.16; g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(v,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    osc.connect(g); g.connect(ac.destination); osc.start(t0); osc.stop(t0+dur+.03); },
  // 答对：清脆铃音「叮」——高频双音快速衰减，像百词斩
  correct(){
    this.note(1568, 0,   .10, {vol:.20});
    this.note(2093, .005,.30, {vol:.10, type:'sine'});
    this.note(3136, .01, .18, {vol:.045, type:'triangle'});
  },
  // 答错：低沉闷响「嗡」
  wrong(){
    this.note(196, 0,   .16, {type:'triangle', vol:.22, glide:146});
    this.note(98,  .01, .22, {type:'sine',     vol:.16, glide:78});
  },
  // 翻卡：轻「沙」
  flip(){ this.note(2100, 0, .05, {type:'triangle', vol:.045, glide:1500}); },
  tap(){ this.note(1200, 0, .035, {type:'triangle', vol:.045}); },
  // 完成：上行三音
  done(){ [659.25, 830.6, 1046.5].forEach((f,i)=>this.note(f, i*.075, .28, {vol:.10})); }
};

// 语音设置迁移：旧版本默认 -8%，统一重置回正常语速
if(localStorage.getItem('kw_voice_ver')!=='2'){
  localStorage.setItem('kw_rate','0%');
  localStorage.setItem('kw_speed','1');
  localStorage.setItem('kw_voice_ver','2');
}

const S = {
  token: localStorage.getItem('kw_token')||'',  nick: localStorage.getItem('kw_nick')||'',
  meta:null, queue:[], idx:0, mode:'all', flipped:false, celebrated:false,
  subj:'', kw:'', scope:'learned', studySubject:'', learnedTotal:0, counts:{new:0,review:0,again:0},
  quiz:[], qi:0, picked:new Set(), answered:false, answers:{}, favs:new Set(),
  exam:null, examTimer:null,
  autoSpeak: localStorage.getItem('kw_autospeak')==='1',
  voice: localStorage.getItem('kw_voice')||'yunyang',
  speechRate: localStorage.getItem('kw_rate')||'0%',
  playSpeed: parseFloat(localStorage.getItem('kw_speed')||'1'),
};
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastTimer;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('on'),1900); }
function syncSfx(){ const b=$('#sfxbtn'); if(!b)return; b.textContent=SFX.on?'🔊':'🔇'; b.classList.toggle('off',!SFX.on); }

async function api(path, opt){
  opt=opt||{}; const h={'Content-Type':'application/json'};
  if(S.token) h['Authorization']='Bearer '+S.token;
  const r=await fetch(API+path,Object.assign({},opt,{headers:h}));
  const j=await r.json().catch(()=>({ok:false,error:'网络错误'}));
  if(!j.ok && j.error==='请先登录'){ logout(); }
  return j;
}
function logout(){ S.token=''; S.nick=''; localStorage.removeItem('kw_token'); localStorage.removeItem('kw_nick'); renderLogin(); }
function switchTab(n){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===n));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  $('#v-'+n).classList.add('on');
  if(n==='home') loadHome();
  if(n==='quiz') loadQuiz();
  if(n==='wrong') loadWrong();
  if(n==='me') loadMe();
}
function showView(n){ document.querySelectorAll('.view').forEach(v=>v.classList.remove('on')); $('#v-'+n).classList.add('on'); }

/* ---------- 登录 ---------- */
let regMode=false;
function renderLogin(){
  const v=$('#v-home'); v.innerHTML='';
  const box=el('div','login');
  box.innerHTML=`
    <h2>${regMode?'创建账号':'欢迎回来'}</h2>
    <p>${regMode?'昵称 2-12 字，密码至少 6 位':'登录后开始今天的背诵'}</p>
    <input id="nick" placeholder="昵称" autocomplete="username">
    <input id="pw" type="password" placeholder="密码" autocomplete="current-password">
    <div class="err" id="loginerr"></div>
    <button class="btn" id="dobtn">${regMode?'注册并登录':'登录'}</button>
    <div class="toggle" id="toggle">${regMode?'已有账号？<b>去登录</b>':'没有账号？<b>去注册</b>'}</div>`;
  v.appendChild(box);
  $('#toggle').onclick=()=>{ regMode=!regMode; renderLogin(); };
  const go=async()=>{
    const nick=$('#nick').value.trim(), pw=$('#pw').value;
    if(!nick||!pw) return ($('#loginerr').textContent='昵称和密码都要填');
    const j=await api('/api/'+(regMode?'register':'login'),{method:'POST',body:JSON.stringify({nick,pw})});
    if(!j.ok) return ($('#loginerr').textContent=j.error||'失败');
    S.token=j.token; S.nick=j.nick;
    localStorage.setItem('kw_token',j.token); localStorage.setItem('kw_nick',j.nick);
    switchTab('home');
  };
  $('#dobtn').onclick=go;
  $('#pw').onkeydown=e=>{ if(e.key==='Enter') go(); };
}

/* ---------- 首页 ---------- */
async function loadHome(){
  if(!S.token) return renderLogin();
  const v=$('#v-home');
  const [meta, learned, cnt] = await Promise.all([
    S.meta?Promise.resolve(S.meta):api('/api/meta'),
    api('/api/learned?'+new URLSearchParams({scope:S.scope,subject:S.subj,q:S.kw})),
    api('/api/today?mode=counts'),
  ]);
  S.meta=meta; if(!cnt.ok) return renderLogin();
  S.counts=cnt.counts;
  const total=meta.atoms||meta.points||0, lTotal=learned.total||0;
  S.learnedTotal=lTotal;
  const pct=total?Math.round(lTotal/total*100):0;
  const dueN=cnt.counts.review+cnt.counts.again, newN=cnt.counts.new;
  const newDone=cnt.counts.done_today - cnt.counts.review > 0 ? Math.min(20, cnt.counts.done_today) : 0;
  const dayLeft = newN===0?0:Math.ceil((total-lTotal)/20);

  v.innerHTML='';
  // 词书条
  const bk=el('div','bookbar');
  bk.innerHTML=`
    <div class="bk-top">
      <div class="cover"><span>政治</span></div>
      <div class="bk-info">
        <div class="bk-name">考研政治核心背诵笔记 <i>徐涛 · 2027</i></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="bk-nums"><span><b>${lTotal}</b> / ${total}</span><span>剩余 ${dayLeft} 天</span></div>
      </div>
    </div>`;
  v.appendChild(bk);

  // 今日计划
  const plan=el('div','plan');
  const goalN=(S.meta&&S.meta.daily_new)||20;
  plan.innerHTML=`
    <h3>今日计划 <em id="goalEdit" style="cursor:pointer;color:var(--brand)">目标 ${goalN} 张 ⚙</em></h3>
    <div class="two">
      <div><span>已新学</span><b>${cnt.counts.new_done||0}<i>/${goalN}</i></b></div>
      <div><span>已复习</span><b>${cnt.counts.rev_done||0}<i>/${cnt.counts.rev_done+dueN}</i></b></div>
    </div>
    <div class="btns">
      <button id="btnLearn">学 习</button>
      <button id="btnReview" class="ghost">复 习</button>
    </div>`;
  v.appendChild(plan);
  $('#goalEdit').onclick=()=>openGoalSheet();

  // 大题专区（交替挖空）
  const datibox=el('div','datibox');
  datibox.innerHTML=`
    <div class="dbhead"><span class="dbic">🖋</span><div><b>背大题</b><i>交替挖空 · 零碎时间刷</i></div></div>
    <div class="dbbtns">
      <button class="dbb" data-s="曲艺模板"><b>曲艺模板</b><span>27 张万能模板</span></button>
      <button class="dbb" data-s="大题模板"><b>答题骨架</b><span>10 张结构模板</span></button>
    </div>`;
  datibox.querySelectorAll('.dbb').forEach(b=>{
    b.onclick=()=>startDati(b.dataset.s);
  });
  v.appendChild(datibox);
  $('#btnLearn').onclick=()=>startStudy('all');
  const rb=$('#btnReview');
  if(!dueN){ rb.disabled=true; rb.textContent='今日已复习'; }
  rb.onclick=()=>startStudy('review');

  // 已学 / 全部 检索
  const sec=el('div','sec',`<h3>${S.scope==='all'?'知识点库':'已学卡片'}</h3><em>${S.scope==='all'?'整本书都可搜':'点开可看全文'}</em>`);
  v.appendChild(sec);

  const seg=el('div','seg');
  [['learned','已学'],['all','全部']].forEach(([val,txt])=>{
    const b=el('button',S.scope===val?'on':'',txt);
    b.onclick=()=>{ S.scope=val; loadHome(); };
    seg.appendChild(b);
  });
  v.appendChild(seg);

  const sb=el('div','searchbox');
  const inp=el('input'); inp.placeholder='搜索知识点…'; inp.value=S.kw;
  let tmr; inp.oninput=()=>{ clearTimeout(tmr); tmr=setTimeout(()=>{ S.kw=inp.value.trim(); loadHome(); },400); };
  sb.appendChild(inp); v.appendChild(sb);

  const chips=el('div','chips');
  const mk=(label,val)=>{ const c=el('button','chip'+(S.subj===val?' on':''),label);
    c.onclick=()=>{ S.subj=val; loadHome(); }; return c; };
  chips.appendChild(mk('全部',''));
  (meta.subjects||['马原','毛中特','史纲','思修','当代']).forEach(x=>chips.appendChild(mk(x,x)));
  v.appendChild(chips);

  const list=el('div','plist');
  if(!learned.points||!learned.points.length){
    list.appendChild(el('div','empty','<div class="big">🌱</div><h3>还没有学过的卡片</h3><p>点「学习」，<br>每天推进 20 张。</p>'));
  } else {
    learned.points.forEach(p=>{
      const it=el('div','pitem');
      const isL=!!p.learned;
      const tag = !isL ? '<span class="badge newb">未学</span>'
        : (p.days<=0?'<span class="badge due">该复习</span>':`<span class="badge ok2">${p.days} 天后</span>`);
      it.innerHTML=`<div class="t">${esc(p.front)}</div>
        <div class="m"><span class="badge">${esc(p.subject)}</span>${tag}
        <span>${isL?'重复 '+p.reps+' 次':'点开预览'}</span></div>`;
      it.onclick=()=>openPoint(p);
      list.appendChild(it);
    });
  }
  v.appendChild(list);
}

function openPoint(p){
  const sh=$('#sheet');
  sh.innerHTML=`

async function startStudy(mode){

  S.mode=mode; showView('study');
  const v=$('#v-study');
  v.innerHTML='<div class="empty"><div class="big">⏳</div><p>正在准备…</p></div>';

  try{ const st=await api('/api/settings'); if(st.ok&&S.meta) S.meta.daily_new=st.daily_new; }catch(e){}
  const sub=S.studySubject||'';
  const j=await api('/api/today?mode='+mode+(sub?'&subject='+encodeURIComponent(sub):''));
  if(!j.ok) return;
  S.queue=shuffleArr(j.cards||[]); S.idx=0; S.celebrated=false;
  S.learnedToday=(j.counts&&j.counts.new_done)||0;
  ensureCycle();
  // 换学科/重开时清空当前批次，否则旧批次会立刻凑满触发小测
  S.batch=[]; S.pending=[]; S.interleave=false;
  saveCycle();
  renderLearn();
  // 后台预生成接下来 3 张的音频，翻到就秒播
  (j.cards||[]).slice(0,3).forEach((card,i)=>{
    setTimeout(()=>{
      try{ const a=new Audio(); a.preload='auto'; a.src=ttsUrl(speakTextOf(card)); a.load(); }catch(e){}
    }, 800 + i*1200);
  });
}

function rateLabel(v){
  v=+v;

  if(v<=-12) return '慢';

/* 朗读 */
let _ttsAudio=null, _ttsBtn=null, _preload={url:'',audio:null}, _ttsGen=0;

function ttsUrl(text){
  const voice=S.voice||'yunyang';
  const rate=S.speechRate||'-8%';
  // v=3 是引擎版本位：换 TTS 引擎时递增，强制浏览器丢弃旧缓存
  return '/api/tts?text='+encodeURIComponent((text||'').slice(0,600))
    +'&voice='+voice+'&rate='+encodeURIComponent(rate)+'&v=3';
}

/* 进入卡片时先把音频下下来，点朗读就秒播 */
function preloadTTS(text){
  const url=ttsUrl(text);
  if(_preload.url===url) return _preload.audio;
  try{
    const a=new Audio();
    a.preload='auto';
    a.muted=true;              // 预加载的永不发声
    a.src=url;
    a.load();
    _preload={url, audio:a};
    return a;
  }catch(e){ return null; }
}

function stopAllTTS(){
  _ttsGen++;                   // 让所有在途回调失效
  if(_ttsAudio){ try{ _ttsAudio.pause(); _ttsAudio.currentTime=0; }catch(e){} _ttsAudio=null; }
  if(_preload.audio){ try{ _preload.audio.pause(); }catch(e){} }
  if(_ttsBtn){ _ttsBtn.classList.remove('on'); _ttsBtn=null; }
}

function speakText(text, btn){
  if(!text) return;
  try{
    stopAllTTS();
    const myGen=_ttsGen;
    const url=ttsUrl(text);
    const a=(_preload.url===url && _preload.audio) ? _preload.audio : new Audio(url);
    if(_preload.audio!==a){ _preload={url:'',audio:null}; }
    a.muted=false;
    a.preservesPitch=true; a.mozPreservesPitch=true; a.webkitPreservesPitch=true;
    a.playbackRate=+(S.playSpeed||1);
    _ttsAudio=a; _ttsBtn=btn||null;
    if(btn) btn.classList.add('on');
    a.onended=()=>{ if(myGen!==_ttsGen) return; if(btn) btn.classList.remove('on'); if(_ttsAudio===a) _ttsAudio=null; };
    a.onerror=()=>{ if(myGen!==_ttsGen) return; if(btn) btn.classList.remove('on'); toast('朗读暂时不可用'); };
    a.currentTime=0;
    a.play().catch(()=>{ if(myGen===_ttsGen && btn) btn.classList.remove('on'); });
  }catch(e){ toast('朗读失败'); }
}
function stopSpeak(){
  stopAllTTS();
}
/* 把富文本清洗成适合朗读的纯文本 */
function speakTextOf(c){
  let t=(c.front||'')+'。'+(c.back||'');
  return t.replace(/[｜|]/g,'，').replace(/[·•]/g,'，').replace(/\s+/g,' ')
          .replace(/[（(]\s*(错|对)\s*[）)]/g,'').slice(0,600);
}

/* ---------- 学-测-纠错 循环 ---------- */
const BATCH_SIZE = 5;      // 每学 5 张测一次
const PASS_STREAK = 2;     // 错题连续答对 2 次才移出错题池

function ensureCycle(){
  if(!S.batch) S.batch=[];
  if(!S.pending) S.pending=[];
  if(!S.streak) S.streak={};
  if(!S.wrongPool) S.wrongPool=[];
}
function saveCycle(){
  try{
    localStorage.setItem('kw_cycle', JSON.stringify({
      batch:S.batch.map(x=>x.id), pending:S.pending.map(x=>x.id),
      streak:S.streak, wrongPool:S.wrongPool, wrongStreak:S.wrongStreak||{}
    }));
  }catch(e){}
}

async function finishLearnCard(c, gradeVal){
  ensureCycle();
  S.batch.push(c);
  if(c.kind==='new') S.learnedToday=(S.learnedToday||0)+1;
  S.idx++;
  saveCycle();
  if(S.batch.length >= BATCH_SIZE){
    await startBatchQuiz();
  } else if(S.batch.length % 2 === 0 && S.wrongPool.length){
    // 每学 2 张，穿插 1 道错题
    S.interleave = true;
    S.pending = [S.wrongPool[0]];
    saveCycle();
    renderBatchQuiz();
  } else {
    renderLearn();
  }
}

async function startBatchQuiz(){
  ensureCycle();
  S.pending = S.batch.slice();
  S.batch = [];
  saveCycle();
  showView('study');
  renderBatchQuiz();
}

/* 小测：每题一次，答完给完整反馈，错的记进错题池 */
/* 每次渲染重新打乱选项（正确答案跟着换位置） */
function reshuffleFill(f){
  if(!f||!f.options||!f.options.length) return f;
  const idx=f.options.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [idx[i],idx[j]]=[idx[j],idx[i]];
  }
  const ans=new Set(f.answers||[]);
  return {
    stem:f.stem,
    options:idx.map(i=>f.options[i]),
    answers:idx.reduce((acc,orig,pos)=>{ if(ans.has(orig)) acc.push(pos); return acc; },[]).sort((a,b)=>a-b)
  };
}

function renderBatchQuiz(){
  ensureCycle();
  const v=$('#v-study'); v.innerHTML='';
  if(!S.pending.length){
    if(S.interleave){
      S.interleave=false;
      renderLearn();
    } else {
      finishBatch();
    }
    return;
  }
  const c=S.pending[0];
  const f=reshuffleFill(c.fill);

  const bar=el('div','qbar');
  bar.innerHTML=`<div class="qtitle">${S.interleave?'错题穿插':'小测'} <span class="qprog">剩 ${S.pending.length} 张</span></div>`;
  v.appendChild(bar);

  const st=el('div','fillstem');
  let html=richText((f&&f.stem)||c.front).replace(/＿＿＿＿/g,'<span class="blank">＿</span>');
  html=html.replace(/^【考点】([\s\S]*?)\n\n/, '<div class="qpoint">$1</div>');
  st.innerHTML=html;
  v.appendChild(st);

  const opts=(f&&f.options)||[];
  const answers=new Set((f&&f.answers)||[]);
  const box=el('div','opts');
  opts.forEach((text,i)=>{
    const L=String.fromCharCode(65+i);
    const o=el('div','opt',`<span class="ltr">${L}</span><span>${esc(text)}</span>`);
    o.onclick=()=>{
      if(box.dataset.done) return;
      box.dataset.done='1';
      const ok=answers.has(i);
      // 标出对错：选中项 + 正确项
      Array.from(box.children).forEach((el2,k)=>{
        if(answers.has(k)) el2.classList.add('ok');
        else if(k===i) el2.classList.add('bad');
        el2.style.pointerEvents='none';
      });
      ok ? SFX.correct() : SFX.wrong();

      if(!ok){
        // 答错 → 记入错题池（连对计数归零）
        ensureCycle();
        S.wrongStreak = S.wrongStreak||{};
        S.wrongStreak[c.id]=0;
        if(!S.wrongPool.some(x=>x.id===c.id)) S.wrongPool.push(c);
        saveCycle();
      } else if(S.wrongPool.some(x=>x.id===c.id)){
        // 错题答对 → 连对 +1
        ensureCycle();
        S.wrongStreak = S.wrongStreak||{};
        S.wrongStreak[c.id]=(S.wrongStreak[c.id]||0)+1;
        if(S.wrongStreak[c.id] >= PASS_STREAK){
          S.wrongPool = S.wrongPool.filter(x=>x.id!==c.id);
          delete S.wrongStreak[c.id];
        }
        saveCycle();
      }
      S.pending.shift();
      renderQuizFeedback(c, ok, answers, box);
    };
    box.appendChild(o);
  });
  v.appendChild(box);
}

/* 答题反馈：明确告诉你对错 + 正确答案 + 要点 */
function renderQuizFeedback(c, ok, answers, box){
  const v=$('#v-study');
  const fb=el('div','qfb');
  const correctLetters=[...answers].sort((a,b)=>a-b).map(i=>String.fromCharCode(65+i)).join('、');
  let extra='';
  if(!ok && S.wrongPool.some(x=>x.id===c.id)){
    const n=S.wrongStreak&&S.wrongStreak[c.id]||0;
    extra=`<div class="fbn">已记入错题池 · 连续答对 ${n}/${PASS_STREAK} 次后移出</div>`;
  } else if(ok && (S.wrongStreak&&S.wrongStreak[c.id])){
    extra=`<div class="fbn ok">连续答对 ${S.wrongStreak[c.id]}/${PASS_STREAK} 次</div>`;
  }
  fb.innerHTML=`
    <div class="fbt ${ok?'ok':'bad'}">${ok?'✅ 答对了':'❌ 答错了'}</div>
    <div class="fba">正确答案：<b>${correctLetters}</b></div>
    <div class="fbc">${richText(c.back)}</div>
    ${extra}
    <button class="btn" id="fbnext" style="width:100%;margin-top:12px;padding:14px">
      ${S.pending.length>1?'下一题 →':'完成本批 →'}
    </button>`;
  v.appendChild(fb);
  // 小测也能报错 / 改 / 改代码
  const ftools=el('div','datitools');
  const f1=el('button','dtilink','🚩 这题有问题');
  f1.onclick=()=>openIssueSheet(c);
  const f2=el('button','dtilink','✏️ 直接改');
  f2.onclick=()=>openCardEdit(c);
  const f3=el('button','dtilink','⚡ 改代码');
  f3.onclick=()=>openDevSheet('改一下小测这个页面：');
  ftools.appendChild(f1); ftools.appendChild(f2); ftools.appendChild(f3);
  fb.appendChild(ftools);
  fb.querySelector('#fbnext').onclick=()=>renderBatchQuiz();
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function finishBatch(){
  const v=$('#v-study'); v.innerHTML='';
  SFX.done();
  v.appendChild(learnBar(0,0,'本批完成'));
  const wrongN=(S.wrongPool||[]).length;
  v.appendChild(el('div','empty',`<div class="big">✅</div><h3>这一批测完了</h3>
    <p>错题已记入错题池（${wrongN} 张），<br>会在后面的学习里穿插出现。</p>`));
  const b=el('button','btn','继续学下面 5 张 →');
  b.onclick=()=>{ S.batch=[]; saveCycle(); renderLearn(); };
  v.appendChild(b);
}

function renderLearn(){
  stopSpeak();
  const v=$('#v-study'); v.innerHTML='';
  if(!S.queue.length || S.idx>=S.queue.length){
    v.appendChild(learnBar(0,0,S.mode==='review'?'复习':'学习'));
    v.appendChild(el('div','empty',`<div class="big">🎉</div><h3>${S.mode==='review'?'复习完成':'今天的任务结束了'}</h3>
      <p>${S.mode==='review'?'没有到期的卡片，明天再来。':'新卡和复习都清空了。<br>明天继续，别断。'}</p>`));
    if(!S.celebrated){ SFX.done(); S.celebrated=true; }
    const b=el('button','btn','回到书桌'); b.onclick=()=>switchTab('home'); v.appendChild(b);
    return;
  }
  const c=S.queue[S.idx];
  const isNew=c.kind==='new';
  v.appendChild(learnBar(S.idx,S.queue.length,isNew?'待学':'需复习'));

  // 学科切换（含「固定搭配」）
  const chips=el('div','chips');
  chips.style.paddingTop='2px';
  const mkSub=(label,val)=>{
    const b=el('button','chip'+(S.studySubject===val?' on':''),label);
    b.onclick=()=>{ S.studySubject=val; startStudy(S.mode); };
    return b;
  };
  chips.appendChild(mkSub('全部',''));
  ((S.meta&&S.meta.subjects)||[]).forEach(x=>chips.appendChild(mkSub(x,x)));
  v.appendChild(chips);

  // 新卡或纯阅读卡：先学不考；复习卡才出题
  if(isNew || c.read){
    renderStudyView(v,c);
    return;
  }

  // 视觉块
  const vis=el('div','visual');
  vis.innerHTML=`<div class="subj">${esc(c.subject||'政治')}</div>
    <div class="chap">${esc(c.chapter||'')}</div>`;
  v.appendChild(vis);

  // 标题
  v.appendChild(el('div','word'+(isNew?' new':''),esc(c.front)));

  // 有合格挖空用挖空；没有就用「知识点摘要四选一」（界面保持一致）
  const fill=c.fill?reshuffleFill(c.fill):null;
  const opts = fill ? fill.options : (c.options||[]);
  const answers = fill ? new Set(fill.answers) : null;
  const multi = fill ? fill.answers.length>1 : false;

  if(multi){
    v.appendChild(el('div','multitip',
      `<b>多选题</b>：近 5 年真题里选 3 个的占 65%，选 2 个 25%，选 4 个 10%。<br>
       确定 2 个后，若第 3 个与已选不矛盾且不绝对，建议选上。`));
  }

  if(fill){
    v.appendChild(el('div','subline','把空缺处填上 · '+(multi?`选出 ${fill.answers.length} 项`:'选出一项')));
    const st=el('div','fillstem');
    let html=richText(fill.stem).replace(/＿＿＿＿/g,'<span class="blank">＿</span>');
    html=html.replace(/^【考点】([\s\S]*?)\n\n/, '<div class="qpoint">$1</div>');
    st.innerHTML=html;
    v.appendChild(st);
  } else {
    v.appendChild(el('div','subline',isNew?'新知识点 · 选出正确的一项':'回忆一下，选出正确的一项'));
  }

  const grid=el('div','grid4'+(opts.length>4?' more':''));
  let answered=false;
  const picked=new Set();

  opts.forEach((txt,i)=>{
    const b=el('button','g4',`<span class="ltr">${'ABCDEFG'[i]||i+1}</span><span class="txt">${esc(txt)}</span>`);
    b.dataset.i=i;
    b.onclick=()=>{
      if(answered) return;
      if(!multi){ picked.clear(); picked.add(i); judge(); return; }
      if(picked.has(i)){ picked.delete(i); b.classList.remove('sel'); }
      else { picked.add(i); b.classList.add('sel'); }
    };
    grid.appendChild(b);
  });
  v.appendChild(grid);

  if(multi){
    const sb=el('button','btn','提交答案');
    sb.style.cssText='width:100%;margin-top:10px';
    sb.onclick=()=>judge();
    v.appendChild(sb);
  }

  // 底部三键
  const tb=el('div','toolbar3');
  const bKill=el('button','tb','⚔️'); bKill.title='直接算认识';
  const bHint=el('button','tb','💡'); bHint.title='排除两个错误项';
  const bInfo=el('button','tb','📖'); bInfo.title='看完整要点';
  tb.appendChild(bKill); tb.appendChild(bHint); tb.appendChild(bInfo);
  v.appendChild(tb);

  bKill.onclick=()=>{ if(answered) return; answered=true; SFX.tap(); grade(2,true); };
  bInfo.onclick=()=>{ SFX.tap(); showDetail(c); };
  bHint.onclick=()=>{
    if(answered||!opts.length) return;
    SFX.tap();
    const wrongIdx=[...grid.children].filter((x,i)=>!answers||!answers.has(i)).slice(0,2);
    wrongIdx.forEach(x=>x.classList.add('fade'));
    bHint.classList.add('on');
  };

  // 学习卡工具条：报错 / 直接改 / 改代码（复习卡走这条路径）
  const ltools=el('div','datitools');
  const l1=el('button','dtilink','🚩 这张卡有问题');
  l1.onclick=()=>openIssueSheet(c);
  const l2=el('button','dtilink','✏️ 直接改');
  l2.onclick=()=>openCardEdit(c);
  const l3=el('button','dtilink','⚡ 改代码');
  l3.onclick=()=>openDevSheet('改一下学习卡片这个页面：');
  ltools.appendChild(l1); ltools.appendChild(l2); ltools.appendChild(l3);
  v.appendChild(ltools);

  function judge(){
    if(answered) return;
    if(!picked.size) return toast('先选一两个选项');
    answered=true;

    const correctSet = answers || new Set([opts.indexOf(c.correct)]);
    const ok = picked.size===correctSet.size && [...picked].every(i=>correctSet.has(i));
    if(ok) SFX.correct(); else SFX.wrong();

    [...grid.children].forEach((x,i)=>{
      x.onclick=null;
      if(correctSet.has(i)) x.classList.add('right');
      else if(picked.has(i)) x.classList.add('wrong');
    });

    // 完整原文 + 手动下一步
    showDetail(c);
    const nb=el('button','btn',(ok?'下一题 →':'看懂了，下一题 →'));
    nb.style.cssText='width:100%;margin:14px 0 10px;padding:16px';
    nb.onclick=()=>grade(ok?2:0,true);
    v.appendChild(nb);

    // 答完后也能报错/改
    const jtools=el('div','datitools');
    const j1=el('button','dtilink','🚩 这张卡有问题');
    j1.onclick=()=>openIssueSheet(c);
    const j2=el('button','dtilink','✏️ 直接改');
    j2.onclick=()=>openCardEdit(c);
    const j3=el('button','dtilink','⚡ 改代码');
    j3.onclick=()=>openDevSheet('改一下学习卡片这个页面：');
    jtools.appendChild(j1); jtools.appendChild(j2); jtools.appendChild(j3);
    v.appendChild(jtools);

    setTimeout(()=>nb.scrollIntoView({behavior:'smooth',block:'nearest'}),60);
  }
}

async function showDetail(c){
  const old=document.querySelector('.detail'); if(old) old.remove();
  const d=el('div','detail');
  d.innerHTML=`<span class="lbl">完整要点</span><div class="dtxt">${richText(c.back)}</div>`;
  $('#v-study').appendChild(d);

  // 易错判断（书里的「（错）/（对）」例句）
  if(c.judge && c.judge.length){
    const jd=el('div','judgebox');
    jd.innerHTML=`<div class="jh">⚠️ 易错判断（命题人埋的坑）</div>` +
      c.judge.map(x=>`<div class="jitem ${x.ok?'ok':'bad'}">
        <span class="jt">${x.ok?'对':'错'}</span><span>${esc(x.text)}</span></div>`).join('');
    d.appendChild(jd);
  }

  // 这个知识点考过的题
  const rel=el('div','relex');
  d.appendChild(rel);
  const j=await api('/api/point_questions?point_id='+c.id);
  if(j.ok && j.questions && j.questions.length){
    rel.innerHTML=`<div class="relh">📌 考过这个知识点的题（${j.questions.length}）</div>`;
    j.questions.forEach(q=>{
      const it=el('div','qlink');
      it.innerHTML=`<div class="qsrc"><b>${esc(q.source)}</b> · 第 ${q.num||q.id} 题 <span>${q.qtype==='multi'?'多选':'单选'}</span></div>
        <div class="qtxt">${esc(q.stem.slice(0,70))}${q.stem.length>70?'…':''}</div>`;

      rel.appendChild(it);
    });
  } else {
    rel.innerHTML='<div class="relh">📌 这套资料里暂时没有关联的题</div>';

  d.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function openQuestion(q){
  const correct=(q.answer||'').split('').sort().join('');
  const sh=$('#sheet');
  sh.innerHTML=`
    <div class="grab"></div>
    <h2>${esc(q.source)} · 第 ${q.num||q.id} 题</h2>
    <div class="sub">${q.year} 年 · ${q.qtype==='multi'?'多选':'单选'}${q.subject?' · '+esc(q.subject):''}</div>
    <div class="body">${esc(q.stem)}</div>
    <div class="qopts">
      ${Object.keys(q.options||{}).sort().map(L=>`
        <div class="qo ${correct.includes(L)?'ok':''}"><b>${L}</b><span>${esc(q.options[L])}</span></div>`).join('')}
    </div>
    <div class="meta"><div>正确答案<b>${esc(q.answer)}</b></div></div>
    ${q.main?`<div class="qana"><div class="lbl">解析</div>${esc(q.main)}</div>`:''}
    ${(q.items||[]).length?`<div class="qana"><div class="lbl">逐项判断</div>
      ${q.items.map(it=>`<div class="aitem ${it.verdict==='right'?'ok':'bad'}">
        <span class="al">${it.letter||'·'}</span><span class="at">${esc(it.text)}</span></div>`).join('')}</div>`:''}
    ${(!q.main && (q.items||[]).length===0 && q.analysis)?`<div class="qana"><div class="lbl">解析</div>${esc(q.analysis)}</div>`:''}`;
  $('#mask').classList.add('on');
}

async function grade(n,silent){
  if(!silent) SFX.tap();
  const c=S.queue[S.idx];
  const j=await api('/api/review',{method:'POST',body:JSON.stringify({point_id:c.id,grade:n})});
  if(!j.ok) return toast(j.error||'保存失败');
  if(n===0){ S.queue.push(Object.assign({},c,{kind:'again'})); }
  S.idx++;
  renderLearn();
}

function lastProgress(){ try{ return JSON.parse(localStorage.getItem('kw_qs_last')||'null'); }catch(e){ return null; } }
function saveProgress(label){
  if(!S.quiz.length) return;
  localStorage.setItem('kw_qs_'+S.quizKey, JSON.stringify({ids:S.quiz.map(q=>q.id), idx:S.qi, label, filter:qFilter}));
  localStorage.setItem('kw_qs_last', JSON.stringify({key:S.quizKey, label, idx:S.qi, total:S.quiz.length, ts:Date.now()}));
}
function clearProgress(key){ localStorage.removeItem('kw_qs_'+key); localStorage.removeItem('kw_qs_last'); }


function qLabel(){
  const t = qFilter.type?(' · '+(qFilter.type==='multi'?'多选':'单选')):'';
  if(qFilter.source) return qFilter.source + t;
  return (qFilter.year?qFilter.year+' 年':'混合') + t;
}

async function startQuiz(force){
  const key=qKey();
  if(!force){
    const s=JSON.parse(localStorage.getItem('kw_qs_'+key)||'null');
    if(s && s.idx>0 && s.idx<s.ids.length){ return resumeQuiz(key); }
  }
  const q=new URLSearchParams({n:'20'});
  if(qFilter.year) q.set('year',qFilter.year);
  if(qFilter.type) q.set('type',qFilter.type);
  if(qFilter.source) q.set('source',qFilter.source);
  const j=await api('/api/quiz?'+q);
  if(!j.ok) return toast(j.error);
  S.quiz=j.questions||[]; S.qi=0; S.picked=new Set(); S.answered=false; S.quizKey=key;
  saveProgress(qLabel());
  renderQuestion(qLabel());
}

async function resumeQuiz(key){
  const s=JSON.parse(localStorage.getItem('kw_qs_'+key)||'null');
  if(!s) return startQuiz(true);
  if(s.filter) qFilter=s.filter;
  const j=await api('/api/quiz?ids='+s.ids.join(','));
  // 题库更新后旧 ID 可能失效 —— 自动作废进度、重新开一组
  if(!j.ok || !j.questions || j.questions.length * 2 < s.ids.length){
    clearProgress(key);
    return startQuiz(true);
  }
  S.quiz=j.questions||[]; S.qi=Math.min(s.idx,S.quiz.length); S.picked=new Set();
  S.answered=false; S.quizKey=key;
  renderQuestion(s.label||'');
}
