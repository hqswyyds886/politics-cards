function pickQ(L,node){
  if(S.answered) return;
  const q=S.quiz[S.qi];
  if(q.qtype==='single'){ S.picked=new Set([L]); submitQ(); }
  else{
    if(S.picked.has(L)){ S.picked.delete(L); node.classList.remove('sel'); node.style.boxShadow=''; }
    else{ S.picked.add(L); node.classList.add('sel'); node.style.boxShadow='inset 0 0 0 1.5px var(--brand)'; }
  }
}

const KEY_WORDS=['首要任务','出发点落脚点','头等大事','第一位','主线','方针','根本指针','着力点','治本之策','基础之策','总目标','总抓手','中心任务'];
function richText(t){
  if(!t) return '';
  let s=esc(t);
  s=s.replace(new RegExp('('+KEY_WORDS.join('|')+')','g'),'<em class="hk">$1</em>');
  s=s.replace(/（错）|\(错\)/g,'<em class="hbad">（错）</em>');
  s=s.replace(/（对）|\(对\)/g,'<em class="hok">（对）</em>');
  s=s.replace(/(正确|符合题意|当选)/g,'<em class="hok">$1</em>');
  s=s.replace(/(错误|不符合题意|不能选)/g,'<em class="hbad">$1</em>');
  return s;
}

async function submitQ(){
  if(S.answered) return;
  const q=S.quiz[S.qi];
  if(!S.picked.size) return toast('先选一个选项');
  S.answered=true;

  const letters=Object.keys(q.options).sort();
  const perm=q.perm||letters;               // perm[i] = 打乱后第 i 位对应的原字母
  const toOld=L=>{ const i=letters.indexOf(L); return (i>=0 && perm[i]) ? perm[i] : L; };
  const toNew=O=>{ const i=perm.indexOf(O); return i>=0 ? letters[i] : O; };

  const chosen=[...S.picked].map(toOld).sort().join('');
  const j=await api('/api/answer',{method:'POST',body:JSON.stringify({question_id:q.id,chosen})});
  S.answers[q.id]={chosen:chosen,ok:!!j.correct};
  // 把答案映射回打乱后的字母
  const correctOld=(j.answer||'').split('').sort();
  const correctNew=correctOld.map(toNew).sort().join('');
  if(j.correct) SFX.correct(); else SFX.wrong();
  document.querySelectorAll('.opt').forEach(o=>{
    const L=o.dataset.l; o.onclick=null;
    if(correctNew.includes(L)) o.classList.add('right');
    else if(S.picked.has(L)) o.classList.add('wrong');
  });

  // 解析：答案 + 考点匹配
  const rel=j.related||[];
  const items=(j.items||[]).map(it=>`
    <div class="aitem ${it.verdict==='right'?'ok':'bad'}">
      <span class="al">${it.letter||'·'}</span><span class="at">${richText(it.text)}</span>
    </div>`).join('');
  const fixed=(j.fixed||[]).map(f=>`
    <div class="fitem">
      <div class="fk">${esc(f.pattern)}${f.topic?' · '+esc(f.topic):''}</div>
      <div class="fa">${esc(f.answer)}</div>
      ${f.note?`<div class="fn">${esc(f.note)}</div>`:''}
    </div>`).join('');
  const box=el('div','ana');
  box.innerHTML=`
    <div class="verdict ${j.correct?'ok':'bad'}">${j.correct?'✅ 答对了':'❌ 答错了'}</div>
    <div class="ansline">正确答案 <b>${esc(correctNew)}</b>${j.correct?'':'　你选了 <b class="u">'+esc([...S.picked].sort().join(''))+'</b>'}</div>
    ${j.main?`<div class="amain">${richText(j.main)}</div>`:''}
    ${items?`<div class="aitems"><div class="ah">逐项判断</div>${items}</div>`:''}
    ${fixed?`<div class="fixedbox"><div class="fh">📌 固定搭配 · 考点速记</div>${fixed}</div>`:''}
    <div class="exclbox"><div class="eh">🔍 排除法三步</div>
      <div class="exclstep"><span class="en">1</span><span><b>排错</b>：绝对化（唯一/全部/完全）、与教材冲突、时态错位</span></div>
      <div class="exclstep"><span class="en">2</span><span><b>排无关</b>：表述正确但没回答设问问的（原因/措施/意义）</span></div>
      <div class="exclstep"><span class="en">3</span><span><b>配对</b>：剩下的看关系——并列同选、对立择一、包含选大</span></div>
    </div>
    ${rel.length?`<div class="rel"><div class="relh">📌 本题考点</div>
      ${rel.map(r=>`<div class="relitem"><div class="relf">${esc(r.front)}</div>
        <div class="relb">${esc(r.back)}</div></div>`).join('')}</div>`:''}`;
  $('#v-quiz').appendChild(box);

  if(!j.correct){
    const rb=el('div','reasonbox');
    rb.innerHTML='<div class="rh">这题错在哪？<span>（按苏一的分类复盘）</span></div>';
    [['base','基础不牢','选项本身判断不了，知识点没记住'],
     ['trans','看不懂换说法','知识点学过，但命题人换了表述'],
     ['match','材料没对应','选项都对，但没对上题干的逻辑']].forEach(([k,t,d])=>{
      const btn=el('button','rbtn',`<b>${t}</b><span>${d}</span>`);
      btn.onclick=()=>{
        [...rb.querySelectorAll('.rbtn')].forEach(x=>x.classList.remove('on'));
        btn.classList.add('on');
        api('/api/reason',{method:'POST',body:JSON.stringify({question_id:q.id,reason:k})});
        toast('已记录：'+t);
      };
      rb.appendChild(btn);
    });
    $('#v-quiz').appendChild(rb);
  }

  const b=el('button','btn','下一题 →');
  b.style.cssText='width:100%;margin:14px 0 24px;padding:16px';
  b.onclick=()=>{ S.qi++; S.picked=new Set(); S.answered=false; saveProgress(); renderQuestion(); };
  $('#v-quiz').appendChild(b);
  setTimeout(()=>b.scrollIntoView({behavior:'smooth',block:'nearest'}),80);
}

/* 大题错题：整句回顾（挖空处直接显示答案） */
function renderDatiWrongList(){
  const v=$('#v-study'); v.innerHTML='';
  if(dq.i>=dq.list.length){
    stopSpeak(); SFX.done();
    v.appendChild(learnBar(0,0,'错题过完'));
    v.appendChild(el('div','empty','<div class="big">✅</div><h3>错题过了一遍</h3><p>记住了的点「移除」，没记住的会留着</p>'));
    const b=el('button','btn','回错题本'); b.onclick=()=>switchTab('wrong'); v.appendChild(b);
    return;
  }
  const q=dq.list[dq.i];
  const bar=el('div','qbar');
  bar.innerHTML=`<button class="back">‹</button>
    <div class="qtitle">大题错题<span class="qprog">第 ${dq.i+1} / ${dq.list.length} 句</span></div>`;
  bar.querySelector('.back').onclick=()=>switchTab('wrong');
  v.appendChild(bar);

  v.appendChild(el('div','datiTag',
    `${esc((q.chapter||'').replace(/\s*·\s*/,' '))} · ${esc(q.title||'')}`));

  const st=el('div','datiStem');
  const filled=(q.stem||'').replace(/＿{4,}/, '【'+(q.answer_text||'')+'】');
  st.innerHTML=richText(filled).replace(/【([^】]+)】/g,'<span class="blank2">$1</span>');
  v.appendChild(st);

  const row=el('div','datiFoot');
  const keep=el('button','btn ghost','还没记住');
  keep.onclick=()=>{ dq.i++; renderDatiWrongList(); };
  const ok=el('button','btn','记住了，移除');
  ok.onclick=async ()=>{
    await api('/api/dati_wrong',{method:'POST',body:JSON.stringify({
      op:'del', pid:q.pid, sentence:q.answer_text||''
    })}).catch(()=>{});
    toast('已移出错题集');
    dq.i++; renderDatiWrongList();
  };
  row.appendChild(keep); row.appendChild(ok);
  v.appendChild(row);
}

      <label>目标<select id="fGoal">${sel('fGoal',p.goal||'增肌',[
        '增肌','减脂','力量提升','增肌同时控制体脂','体态改善与健康'])}</select></label>
      <label>每周练几天<select id="fDays">${sel('fDays',p.days||'3',['2','3','4','5','6'])}</select></label>

    </label>
    <label class="fwide">其他说明
      <input id="fNote" value="${esc(p.notes||'')}" placeholder="例如：想重点练背 / 早上练">
    </label>
    <button class="btn" id="fGen" style="width:100%;margin-top:14px;padding:15px">生成训练计划</button>
    <div id="fLog" class="devlog"></div>`;

  btn.onclick=async ()=>{

      name:S.nick||'我',

      age:g('fAge').value,
      height:g('fHeight').value,
      weight:g('fWeight').value,
      bodyfat:g('fBf').value,
      level:g('fLevel').value,
      goal:g('fGoal').value,
      days:g('fDays').value,
      duration:g('fDur').value,
      equipment:g('fEquip').value,
      injuries:g('fInj').value,
      notes:g('fNote').value
    };
    if(!profile.weight||!profile.height||!profile.age)
      return toast('身高体重年龄要填，数字全靠它们算');
    btn.disabled=true; btn.textContent='AI 正在排计划…';
    log.innerHTML='<div class="dl pending">按渐进超负荷+超量恢复排计划，约 20~50 秒</div>';
    let r={};
    try{
      r=await api('/api/fitness',{method:'POST',body:JSON.stringify({op:'gen',profile:profile})});

        ${(d.exercises||[]).map(e=>`<tr>
          <td>${esc(e.name||'')}${e.weight_hint?`<i class="fp-note">起始：${esc(e.weight_hint)}</i>`:''}${e.note?`<i class="fp-note">${esc(e.note)}</i>`:''}</td>

/* 快速记录体重 / 摄入 */

  const sh=$('#sheet');
  const isW = kind==='weigh';
  sh.innerHTML=`
    <div class="grab"></div>
    <h2>${isW?'记体重':'记摄入'}</h2>
    <div class="sub">${isW?'建议每天同一时间称（晨起排空后）':'填当天的总热量'}</div>
    <div class="fgrid">
      <label>日期<input id="qlD" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
      <label>${isW?'体重 kg':'热量 kcal'}<input id="qlV" type="number" step="${isW?'0.1':'1'}" inputmode="decimal" autofocus></label>
    </div>
    ${isW?'':`<label class="fwide">蛋白质 g（可留空）<input id="qlP" type="number" inputmode="numeric"></label>`}
    <button class="btn" id="qlSave" style="width:100%;margin-top:14px;padding:14px">保存</button>
    <button class="btn ghost" id="qlBack" style="width:100%;margin-top:8px;padding:12px">返回看板</button>`;
  sh.querySelector('#qlBack').onclick=()=>openNutrition();
  sh.querySelector('#qlSave').onclick=async ()=>{
    const day=sh.querySelector('#qlD').value;
    const v=parseFloat(sh.querySelector('#qlV').value||'0');
    if(!v) return toast('填个数字');
    const payload=isW?{op:'weigh',d:day,kg:v}
      :{op:'eat',d:day,kcal:v,protein:parseFloat((sh.querySelector('#qlP')||{}).value||'0')};
    const r=await api('/api/fitness',{method:'POST',body:JSON.stringify(payload)});
    if(!r.ok) return toast(r.error||'保存失败');
    toast('已记录');
    openNutrition();
  };
  $('#mask').classList.add('on');
}

/* 每个动作的进阶状态：该加重 / 保持 / 停滞 */
async function loadFitnessStatus(plan){
  const box=$('#fpStatus');
  if(!box) return;
  const h=await api('/api/fitness',{method:'POST',body:JSON.stringify({op:'history'})});
  const logs=(h.ok&&h.logs)||[];
  if(!logs.length){
    box.innerHTML='<div class="fs-empty">还没有训练记录。记录几次后，这里会自动算出每个动作该不该加重。</div>';
    return;
  }
  // 收集计划里的动作，取目标次数
  const targets={};
  (plan.weekly||[]).forEach(d=>(d.exercises||[]).forEach(e=>{
    if(e.name && !targets[e.name]){
      const m=String(e.reps||'').match(/(\d+)/);
      targets[e.name]=m?parseInt(m[1]):8;
    }
  }));
  // 只显示有记录的动作
  const seen=[];
  logs.forEach(l=>{ if(!seen.includes(l.exercise)) seen.push(l.exercise); });
  box.innerHTML='<div class="fs-title">当前状态</div>';
  for(const ex of seen.slice(0,8)){
    const tr=targets[ex]||8;
    const r=await api('/api/fitness',{method:'POST',body:JSON.stringify({
      op:'ratchet',exercise:ex,target_reps:tr,category:'lower'
    })});
    if(!r.found) continue;
    const cls=r.stalled?'stall':(r.action==='advance'?'go':'hold');
    const tag=r.stalled?'停滞':(r.action==='advance'?'可以加重':'保持重量');
    const row=el('div','fs-row '+cls);
    row.innerHTML=`
      <div class="fs-h"><b>${esc(ex)}</b><span class="fs-tag">${tag}</span></div>
      <div class="fs-d">${esc(r.reason||'')}</div>
      ${r.next_load?`<div class="fs-n">下次目标：<b>${r.next_load} kg</b>　e1RM ${r.e1rm||'-'} kg</div>`:''}
      ${r.stalled&&r.suggest_load?`<div class="fs-w">建议减到 ${r.suggest_load} kg 重新爬升</div>`:''}`;
    box.appendChild(row);
  }
  if(box.children.length<=1){
    box.innerHTML='<div class="fs-empty">记录的动作不在当前计划里，或数据不足。</div>';
  }
}

/* 记录一组训练 + 棘轮反馈 */
function openFitnessLog(plan, day){
  const exNames=[];
  (plan.weekly||[]).forEach(d=>{
    (d.exercises||[]).forEach(e=>{ if(e.name && !exNames.includes(e.name)) exNames.push(e.name); });
  });
  const sh=$('#sheet');
  sh.innerHTML=`
    <div class="grab"></div>
    <h2>记录训练</h2>
    <div class="sub">${esc(day)}</div>
    <div class="fgrid">
      <label>动作<select id="lgEx">
        ${exNames.map(n=>`<option>${esc(n)}</option>`).join('')}
      </select></label>
      <label>重量 kg<input id="lgW" type="number" step="1.25" inputmode="decimal"></label>
      <label>次数<input id="lgR" type="number" inputmode="numeric"></label>
      <label>RPE<input id="lgRpe" type="number" step="0.5" inputmode="decimal" placeholder="8"></label>
    </div>
    <button class="btn" id="lgSave" style="width:100%;margin-top:12px;padding:14px">保存这一组</button>
    <div id="lgMsg" class="devlog"></div>
    <button class="btn ghost" id="lgBack" style="width:100%;margin-top:8px;padding:12px">返回计划</button>`;
  sh.querySelector('#lgBack').onclick=()=>renderFitnessPlan(plan, '我的');
  sh.querySelector('#lgSave').onclick=async ()=>{
    const ex=sh.querySelector('#lgEx').value;
    const w=parseFloat(sh.querySelector('#lgW').value||'0');
    const r=parseInt(sh.querySelector('#lgR').value||'0');
    const rpe=parseFloat(sh.querySelector('#lgRpe').value||'0');
    if(!ex||!w||!r) return toast('重量和次数要填');
    const msg=sh.querySelector('#lgMsg');
    await api('/api/fitness',{method:'POST',body:JSON.stringify({
      op:'log',exercise:ex,weight:w,reps:r,rpe:rpe,sets:1
    })});
    // 拿棘轮建议
    const rt=await api('/api/fitness',{method:'POST',body:JSON.stringify({
      op:'ratchet',exercise:ex
    })});
    let html='<div class="dl ok">已记录</div>';
    if(rt.ok && rt.found){
      html+=`<div class="dl pending">这个动作最重记录：${rt.heaviest} kg｜估算 1RM：${rt.e1rm||'-'} kg</div>`;
      html+=`<div class="dl hint">${esc(rt.advice||'')}</div>`;
    }
    msg.innerHTML=html;
  };
  $('#mask').classList.add('on');
}

  if(dw.ok && (dw.items||[]).length){
    const box=el('div','datibox');
    box.style.cssText='margin-top:0;margin-bottom:14px;background:linear-gradient(135deg,#fef2f2,#fff7ed)';
    box.innerHTML=`
      <div class="dbhead"><span class="dbic" style="background:#fee2e2">🖋</span>

    const bb=el('button','btn','重刷大题错题');
    bb.style.cssText='width:100%;padding:13px';
    bb.onclick=()=>{
      const items=dw.items.map(x=>({
        pid:x.pid, chapter:x.chapter||'', title:x.title||'',
        stem:x.stem||'', answer_text:x.sentence||'',
        options:[], answers:[]
      }));
      dq={list:items, i:0, subj:dq.subj, right:0, wrong:0};
      showView('study');

    box.appendChild(bb);
    const list=el('div','');
    dw.items.slice(0,8).forEach(x=>{
      const it=el('div','datiwrong');
      it.innerHTML=`<div class="dwr">${esc((x.chapter||'').replace(/\s*·\s*/,' '))}</div>

    it.onclick=()=>openQuestion(q);

  });

let exSel={n:20,t:30};

  const sh=$('#sheet');
  sh.innerHTML=`
    <div class="grab"></div>
    <h2>模拟考试</h2>
    <div class="sub">按真实节奏限时作答，交卷后统一判分</div>
    <div class="exrow"><label>题数</label><div class="exopts" data-k="n">
      ${[10,20,33,50].map(n=>`<button class="exb ${n===exSel.n?'on':''}" data-v="${n}">${n}</button>`).join('')}
    </div></div>
    <div class="exrow"><label>时长</label><div class="exopts" data-k="t">
      ${[10,20,30,60,90].map(n=>`<button class="exb ${n===exSel.t?'on':''}" data-v="${n}">${n}分</button>`).join('')}
    </div></div>
    <div class="sub" style="margin-top:14px">来源：全部题库（真题 + 苏一 + 徐涛）</div>
    <button class="btn" id="exstart" style="width:100%;margin-top:10px;padding:16px">开始考试</button>`;
  sh.querySelectorAll('.exopts').forEach(box=>{

        b.classList.add('on');
        exSel[box.dataset.k]=+b.dataset.v;
      };

  $('#exstart').onclick=()=>{ $('#mask').classList.remove('on'); startExam(exSel.n,exSel.t); };
  $('#mask').classList.add('on');
}

async function startExam(n,mins){
  const j=await api('/api/quiz?n='+n);
  if(!j.ok||!j.questions.length) return toast('出题失败');
  S.quiz=j.questions; S.qi=0; S.picked=new Set(); S.answered=false; S.answers={};
  S.exam={end:Date.now()+mins*60000, total:mins, n:n};
  S.quizKey='exam_'+Date.now();
  showView('quiz'); renderExam();
  clearInterval(S.examTimer);
  S.examTimer=setInterval(()=>{
    if(!S.exam) return clearInterval(S.examTimer);
    const left=S.exam.end-Date.now();
    const el2=document.getElementById('exclock');
    if(el2) el2.textContent=fmtLeft(left);
    if(left<=0){ clearInterval(S.examTimer); submitExam(); }
  },1000);
}
function fmtLeft(ms){
  if(ms<0) ms=0;
  const s=Math.floor(ms/1000);
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

function renderExam(){
  const v=$('#v-quiz'); v.innerHTML='';
  const cur=S.qi+1;
  const bar=el('div','qbar');
  bar.innerHTML=`<button class="back">‹</button>
    <div class="qtitle">模拟考试<span class="qprog">第 ${cur} / ${S.quiz.length} 题</span></div>
    <div class="exclock" id="exclock">${fmtLeft(S.exam?S.exam.end-Date.now():0)}</div>`;
  bar.querySelector('.back').onclick=()=>{
    if(!confirm('退出考试？成绩不会保存。')) return;
    clearInterval(S.examTimer); S.exam=null; loadQuiz();
  };
  v.appendChild(bar);

  const pb=el('div','qbar2');
  pb.innerHTML=`<div class="pbar"><i style="width:${cur/S.quiz.length*100}%"></i></div>`;
  v.appendChild(pb);

  const q=S.quiz[S.qi];
  v.appendChild(el('div','quizhead',`<span class="pill ${q.qtype==='multi'?'multi':''}">${q.year} 年 · ${q.qtype==='multi'?'多选':'单选'}</span>`));
  v.appendChild(el('div','qstem',esc(q.stem)));

  const picked=S.answers[q.id]||new Set();
  const opts=el('div','opts');
  Object.keys(q.options).sort().forEach(L=>{
    const o=el('div','opt',`<span class="ltr">${L}</span><span>${esc(q.options[L])}</span>`);
    if(picked.has(L)){ o.classList.add('sel'); o.style.boxShadow='inset 0 0 0 1.5px var(--brand)'; }
    o.onclick=()=>{
      const set=S.answers[q.id]||new Set();
      if(q.qtype==='single'){ S.answers[q.id]=new Set([L]); }
      else{
        if(set.has(L)) set.delete(L); else set.add(L);
        S.answers[q.id]=set;
      }
      renderExam();
    };
    opts.appendChild(o);
  });
  v.appendChild(opts);

  const nav=el('div','exnav');
  const prev=el('button','btn ghost','上一题');
  prev.onclick=()=>{ if(S.qi>0){S.qi--;renderExam();} };
  const next=el('button','btn','下一题');
  next.onclick=()=>{ if(S.qi<S.quiz.length-1){S.qi++;renderExam();} else openSheet('模拟考试',true); };
  const sheetBtn=el('button','btn ghost','答题卡');
  sheetBtn.onclick=()=>openSheet('模拟考试',true);
  nav.appendChild(prev); nav.appendChild(sheetBtn); nav.appendChild(next);
  v.appendChild(nav);

  const sub=el('button','btn','交卷');
  sub.style.cssText='width:100%;margin-top:10px;background:#dc2626;box-shadow:0 8px 20px rgba(220,38,38,.2)';
  sub.onclick=()=>{ if(confirm(`确定交卷？还有 ${S.quiz.length-countAnswered()} 题未作答。`)) submitExam(); };
  v.appendChild(sub);
}
function countAnswered(){ return Object.values(S.answers).filter(s=>s&&s.size).length; }

async function submitExam(){
  clearInterval(S.examTimer);
  const v=$('#v-quiz'); v.innerHTML='<div class="empty"><div class="big">⏳</div><p>正在判分…</p></div>';
  let right=0;
  const detail=[];
  for(const q of S.quiz){
    const set=S.answers[q.id]||new Set();
    const letters=Object.keys(q.options).sort();
    const perm=q.perm||letters;
    const toOld=L=>perm[letters.indexOf(L)];
    const chosen=[...set].map(toOld).sort().join('');
    if(!chosen){ detail.push({q,chosen:'',ok:false,answer:q.answer}); continue; }
    const r=await api('/api/answer',{method:'POST',body:JSON.stringify({question_id:q.id,chosen})});
    if(r.ok&&r.correct) right++;
    detail.push({q,chosen,ok:!!(r.ok&&r.correct),answer:r.answer||q.answer});
  }
  const total=S.quiz.length;
  const score=Math.round(right/total*100);
  SFX.done();
  v.innerHTML='';
  v.appendChild(el('div','empty',`
    <div class="big">${score>=70?'🎉':score>=50?'💪':'📖'}</div>
    <h3>${score} 分</h3>
    <p>答对 ${right} / ${total}　正确率 ${score}%</p>`));
  const again=el('button','btn','再考一次');
  again.onclick=()=>{ S.exam=null; openExamSetup(); };
  v.appendChild(again);

  const list=el('div','qlist');
  detail.forEach((d,i)=>{
    const item=el('div','qres '+(d.ok?'ok':'bad'));
    item.innerHTML=`<span class="qi">${i+1}</span>
      <span class="qt">${esc(d.q.stem.slice(0,42))}…</span>
      <span class="qm">${d.chosen||'未答'} / ${d.answer}</span>`;
    item.onclick=()=>{ S.exam=null; S.quiz=[d.q]; S.qi=0; S.picked=new Set(); S.answered=false; renderQuestion('考试回顾'); };
    list.appendChild(item);
  });
  v.appendChild(list);
  S.exam=null;
}

/* ---------- 我的 ---------- */
const DIST_COLORS = ['#f87171', '#fb923c', '#fbbf24', '#4ade80', '#10b981'];

function renderCurve(d) {
  const box = el('div', 'curve');
  const avgIv = (d.dist[0] * 0.5 + d.dist[1] * 2 + d.dist[2] * 5 + d.dist[3] * 12 + d.dist[4] * 30) /
                Math.max(1, d.dist.reduce((a, b) => a + b, 0)) || 1;

  // 遗忘曲线：按当前平均间隔画衰减
  const W = 320, H = 112, P = 10;
  const maxT = 30;
  const pts = [];
  for (let i = 0; i <= 64; i++) {
    const t = i / 64 * maxT;
    const r = Math.exp(-t / (avgIv * 2.2)) * 100;
    const x = P + t / maxT * (W - 2 * P);
    const y = H - P - r / 100 * (H - 2 * P);
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  const revX = P + Math.min(maxT, avgIv) / maxT * (W - 2 * P);
  const revY = H - P - Math.exp(-avgIv / (avgIv * 2.2)) * (H - 2 * P);

  // 未来 7 天柱状
  const maxUp = Math.max(1, ...d.upcoming);
  const dayNames = ['今天', '明天', '后天'];
  const barsHtml = d.upcoming.map((cnt, i) => {
    const h = Math.max(3, cnt / maxUp * 62);
    const label = i < 3 ? dayNames[i] : `${i}天后`;
    return `<div class="b ${i === 0 ? 'today' : ''}"><b>${cnt || ''}</b>
      <i style="height:${h}px"></i><span>${label}</span></div>`;
  }).join('');

  const totalDist = Math.max(1, d.dist.reduce((a, b) => a + b, 0));
  const distHtml = d.dist.map((n, i) =>
    n ? `<i style="width:${n / totalDist * 100}%;background:${DIST_COLORS[i]}"></i>` : '').join('');
  const legendHtml = d.labels.map((lb, i) =>
    `<span><em style="background:${DIST_COLORS[i]}"></em>${lb} ${d.dist[i]}</span>`).join('');

  box.innerHTML = `
    <h4>🧠 记忆曲线</h4>
    <div class="note">按你当前的平均复习间隔（约 ${avgIv.toFixed(1)} 天）估算的记忆留存。<br>
      曲线越平缓，说明记得越牢。</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1a56db"/><stop offset="100%" stop-color="#2f8ff0"/>
        </linearGradient>
      </defs>
      ${[0, 25, 50, 75, 100].map(v => {
        const y = H - P - v / 100 * (H - 2 * P);
        return `<line x1="${P}" y1="${y}" x2="${W - P}" y2="${y}" stroke="#eef2f8" stroke-width="1"/>
                <text x="${P - 2}" y="${y + 3}" font-size="7" fill="#98a3b3" text-anchor="end">${v}</text>`;
      }).join('')}
      <polyline points="${pts.join(' ')}" fill="none" stroke="url(#fg)" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${revX}" cy="${revY}" r="4" fill="#fff" stroke="#1a56db" stroke-width="2.2"/>
      <line x1="${revX}" y1="${revY}" x2="${revX}" y2="${H - P}" stroke="#c7d6ef" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="${revX}" y="${H - 1}" font-size="7.5" fill="#5d6a7d" text-anchor="middle">下次复习</text>
      <text x="${W - P}" y="${H - 1}" font-size="7.5" fill="#98a3b3" text-anchor="end">30 天</text>
    </svg>

    <h4 style="margin-top:16px">📅 未来 7 天复习量</h4>
    <div class="bars">${barsHtml}</div>

    <h4 style="margin-top:16px">📊 记忆强度分布</h4>
    <div class="dist">${distHtml}</div>
    <div class="dist-legend">${legendHtml}</div>

    <div class="kpi">
      <div><b>${d.retention}%</b><span>记忆留存</span></div>
      <div><b>${d.streak}</b><span>连续天数</span></div>
      <div><b>${d.learned}</b><span>已学卡片</span></div>
    </div>`;
  return box;
}

  const v=$('#v-me');
  const [j, cv] = await Promise.all([api('/api/stats'), api('/api/curve')]);
  v.innerHTML='';
  if(!j.ok) return;
  const g=el('div','statgrid');
  g.innerHTML=`<div class="stat"><b>${j.learned}</b><span>已学卡片</span></div>
    <div class="stat"><b>${j.mastered}</b><span>已掌握（≥21天）</span></div>
    <div class="stat"><b>${j.questions_done}</b><span>累计做题</span></div>
    <div class="stat"><b>${j.accuracy}%</b><span>正确率</span></div>`;
  v.appendChild(g);
  if(cv && cv.ok) v.appendChild(renderCurve(cv));

  // 错题池
  ensureCycle();
  const pool=(S.wrongPool||[]).length;
  const poolRow=el('div','row');
  poolRow.innerHTML=`<span>错题池（连对 2 次才移出）</span><em style="color:${pool?'#dc2626':'var(--ink3)'}">${pool} 张</em>`;
  v.appendChild(poolRow);
  if(pool){
    const pb=el('button','btn ghost','立即重做错题池');
    pb.style.cssText='width:100%;margin-top:8px';
    pb.onclick=()=>{
      S.pending=S.wrongPool.slice();
      S.interleave=false;
      showView('study'); renderBatchQuiz();
    };
    v.appendChild(pb);
  }

  // 今日目标
  const goalRow=el('div','row');
  const goal=(S.meta&&S.meta.daily_new)||20;
  goalRow.innerHTML=`<span>每日新卡目标</span><em>${goal} 张</em>`;
  goalRow.style.cursor='pointer';
  goalRow.onclick=()=>openGoalSheet();
  v.appendChild(goalRow);

  // 朗读音色
  const voiceRow=el('div','row');
  const vname=(VOICE_LIST.find(x=>x[0]===S.voice)||VOICE_LIST[0])[1];
  voiceRow.innerHTML=`<span>朗读音色</span><em>${vname} · ${S.speechRate.replace('-','慢').replace('%','')}</em>`;
  voiceRow.style.cursor='pointer';
  voiceRow.onclick=()=>openVoiceSheet();
  v.appendChild(voiceRow);

  // 开发者：网页里直接下指令改代码
  const devbox=el('div','devbox');
  devbox.innerHTML=`
    <div class="dbhead"><span class="dbic" style="background:#e0e7ff">⚡</span>
      <div><b>开发者</b><i style="color:#4338ca">下指令，AI 直接改这个站的代码</i></div></div>
    <button class="btn" id="devOpen" style="width:100%;padding:14px">打开改代码面板</button>`;
  v.appendChild(devbox);
  devbox.querySelector('#devOpen').onclick=()=>openDevSheet('');

  // 健身教练
  const fitbox=el('div','fitbox');
  fitbox.innerHTML=`
    <div class="dbhead"><span class="dbic" style="background:#dcfce7">🏋️</span>
      <div><b>健身教练</b><i style="color:#15803d">填一次数据，AI 按渐进超负荷出计划</i></div></div>
    <div id="fitBody"><div class="fl-empty">读取中…</div></div>`;
  v.appendChild(fitbox);

  (async()=>{
    const body=fitbox.querySelector('#fitBody');
    const r=await api('/api/fitness',{method:'POST',body:JSON.stringify({op:'get'})});
    if(r.ok && r.exists && r.plan){
      const prof=r.profile||{};
      body.innerHTML=`
        <div class="fl-row" id="fitOpen">
          <div class="fl-main">
            <b>我的训练计划</b>
            <span>${esc(prof.goal||'')} · ${esc(prof.weight||'?')}kg · 每周 ${esc(prof.days||'?')} 练</span>
          </div>
          <span class="fl-go">查看 ›</span>
        </div>
        <button class="btn ghost" id="fitRedo" style="width:100%;margin-top:8px;padding:11px;font-size:12.5px">重新填数据排计划</button>`;
      body.querySelector('#fitOpen').onclick=()=>renderFitnessPlan(r.plan, prof.name||'我的');
      body.querySelector('#fitRedo').onclick=()=>openFitness(prof);
    } else {
      body.innerHTML=`<div class="fl-empty">还没有计划</div>
        <button class="btn" id="fitMake" style="width:100%;margin-top:10px;padding:13px">填写数据，生成计划</button>`;
      body.querySelector('#fitMake').onclick=()=>openFitness(null);
    }
  })();

  v.appendChild(el('div','row',`<span>当前账号</span><em>${esc(S.nick)}</em>`));
  (j.by_subject||[]).forEach(s=>v.appendChild(el('div','row',`<span>${esc(s.subject)}</span><em>${s.mastered}/${s.total} 已掌握</em>`)));
  const out=el('button','btn ghost','退出登录'); out.style.cssText='width:100%;margin-top:12px';
  out.onclick=logout; v.appendChild(out);
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown',e=>{
  if(!$('#v-study').classList.contains('on')) return;
  if(e.code==='Space'){ e.preventDefault(); const b=document.querySelector('.g4'); if(b) b.click(); }
  if(e.key==='1'||e.key==='2'||e.key==='3'||e.key==='4'){
    const i=+e.key-1; const bs=document.querySelectorAll('.g4'); if(bs[i]) bs[i].click();
  }
});

/* ---------- 启动 ---------- */
syncSfx();
$('#sfxbtn').onclick=()=>{ SFX.on=!SFX.on; localStorage.setItem('kw_sfx',SFX.on?'1':'0'); syncSfx(); if(SFX.on) SFX.tap(); };
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
if(S.token) switchTab('home'); else renderLogin();
</script>
</body>
</html>
